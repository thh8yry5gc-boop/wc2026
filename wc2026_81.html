<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Content-Security-Policy (defense-in-depth).
     NOTE ON LIMITS: this app is built on inline on* handlers and an inline
     <style> block, so script-src/style-src MUST allow 'unsafe-inline' or the
     UI breaks entirely. That means CSP is NOT the primary XSS control here —
     the esc() escaping on all imported/API data is. What CSP still buys us:
     (1) script-src host-whitelist — an injected <script src="//evil"> can't
     load; (2) connect-src — fetch/XHR can only reach our API + proxy, so even
     if script ran it can't beacon localStorage to an arbitrary host;
     (3) object-src 'none', base-uri 'none' — kill plugin & <base> hijacks.
     connect-src is locked to the Worker host below; update it if that changes. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
  style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
  font-src https://fonts.gstatic.com;
  img-src 'self' data: https://cdn.jsdelivr.net;
  connect-src https://wc2026-fd.t47n7wwnv4.workers.dev;
  base-uri 'none';
  object-src 'none';
  form-action 'none';
  frame-ancestors 'none'">
<title>ЧМ 2026 — Прогнозы</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#111111;
  --sf:#1a1a1a;
  --sf2:#2a2a2a;
  --glass:rgba(42,42,42,0.85);
  --b:rgba(255,255,255,0.13);
  --b2:rgba(255,255,255,0.22);
  --ac:#f4d03f;
  --ac2:#67e8f9;
  --gr:#4ade80;
  --rd:#f87171;
  --tx:#f0f0f0;
  --mu:#bbbbbb;
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--tx);
  font-family:'IBM Plex Sans',sans-serif;
  background-image:
    radial-gradient(circle at 25% 15%, rgba(244,208,63,0.08) 0%, transparent 50%),
    radial-gradient(circle at 75% 75%, rgba(103,232,249,0.06) 0%, transparent 50%);
  min-height:100vh;
}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}

/* GLASSMORPHISM CONTAINERS */
.gc,.score-card,.mc,.login-box,.api-row,.rules-box,.tbl-wrap,.third-card{
  background:var(--glass);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border:1px solid var(--b2);
  box-shadow:0 8px 32px rgba(0,0,0,0.4);
  border-radius:var(--r);
  transition:all 0.35s cubic-bezier(0.4,0,0.2,1);
}
.gc:hover,.third-card:hover{
  border-color:rgba(244,208,63,0.5);
  box-shadow:0 20px 50px rgba(244,208,63,0.18), 0 0 1px rgba(244,208,63,0.3) inset;
  transform:translateY(-6px);
}
.mc:hover{
  border-color:rgba(244,208,63,0.5);
  box-shadow:0 16px 40px rgba(244,208,63,0.2);
}
.mc:hover{transform:translateY(-2px)}
.mc.mc-filled{
  border-color:rgba(244,208,63,0.45);
  background:linear-gradient(135deg, rgba(244,208,63,0.06), rgba(35,35,35,0.9));
  box-shadow:0 8px 24px rgba(244,208,63,0.12);
}
.mc-t.pen-winner{
  background:linear-gradient(90deg, rgba(244,208,63,0.18) 0%, rgba(244,208,63,0.06) 100%);
  position:relative;
}
.mc-t.pen-winner::after{
  content:'пен';
  position:absolute;
  right:6px;
  top:50%;
  transform:translateY(-50%);
  font-family:'IBM Plex Mono',monospace;
  font-size:8px;
  font-weight:700;
  letter-spacing:.08em;
  color:var(--ac);
  background:rgba(244,208,63,0.18);
  border:1px solid rgba(244,208,63,0.4);
  padding:2px 5px;
  border-radius:4px;
  text-transform:uppercase;
  pointer-events:none;
}
.mc-t.pen-winner .mc-name{color:var(--ac);font-weight:600}
.mc-t.tie-clickable{cursor:pointer;transition:background 0.15s}
.mc-t.tie-clickable:hover{background:rgba(244,208,63,0.06)}
.mc-tie-hint{
  font-size:9px;
  color:var(--ac);
  text-align:center;
  padding:2px 8px;
  border-top:1px dashed rgba(244,208,63,0.3);
  font-family:'IBM Plex Mono',monospace;
  letter-spacing:.05em;
  opacity:0.7;
}
.mc-other{
  font-size:9px;
  color:var(--ac2);
  text-align:center;
  padding:3px 8px;
  border-top:1px dashed rgba(103,232,249,0.25);
  font-family:'IBM Plex Mono',monospace;
  letter-spacing:.02em;
  opacity:0.75;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-weight:600;
}
.mc-other-chip{
  display:inline-block;
  margin-left:5px;
  padding:1px 5px;
  font-size:9px;
  font-weight:700;
  color:var(--ac2);
  background:rgba(103,232,249,0.10);
  border:1px solid rgba(103,232,249,0.35);
  border-radius:4px;
  font-family:'IBM Plex Mono',monospace;
  vertical-align:middle;
  line-height:1.2;
}
.mc.mc-filled:hover{
  border-color:var(--ac);
  box-shadow:0 12px 32px rgba(244,208,63,0.22);
}

/* HEADER */
.hdr{padding:1.5rem 1.5rem 0;display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.hdr-title{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(40px,9vw,76px);
  letter-spacing:0.05em;
  background:linear-gradient(90deg,#f4d03f,#ffffff,#67e8f9);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  line-height:1;
  filter:drop-shadow(0 0 30px rgba(244,208,63,0.2));
}
.hdr-sub{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.1em;margin-top:6px}
.badge{font-family:'IBM Plex Mono',monospace;font-size:12px;background:var(--sf2);border:1px solid var(--b2);border-radius:9999px;padding:6px 14px;color:var(--ac);display:flex;align-items:center;gap:8px}

/* Data menu — collapses Бэкап/Экспорт/Импорт/Очистить into a header dropdown
   so the bottom bar can go away. */
.data-menu{position:relative;display:inline-block}
.data-menu-dropdown{
  display:none;
  position:absolute;
  right:0;
  top:100%;
  margin-top:6px;
  min-width:200px;
  background:var(--glass);
  backdrop-filter:blur(20px);
  border:1px solid var(--b2);
  border-radius:12px;
  padding:6px;
  z-index:100;
  box-shadow:0 12px 32px rgba(0,0,0,0.4);
}
.data-menu-dropdown.open{display:flex;flex-direction:column;gap:2px}
.data-menu-item{
  background:transparent;
  border:none;
  color:var(--tx);
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  text-align:left;
  padding:9px 12px;
  border-radius:8px;
  cursor:pointer;
  transition:background 0.15s;
  letter-spacing:.02em;
  user-select:none;
  -webkit-user-select:none;
}
.data-menu-item:hover{background:rgba(244,208,63,0.08);color:var(--ac)}
.data-menu-item.danger:hover{background:rgba(248,113,113,0.10);color:var(--rd)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ac);box-shadow:0 0 8px var(--ac);flex-shrink:0}

/* TABS */
.tabs{display:flex;gap:4px;padding:0 1.5rem;margin-top:1.5rem;border-bottom:1px solid var(--b);overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  padding:14px 22px;
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  font-weight:600;
  letter-spacing:0.6px;
  text-transform:uppercase;
  cursor:pointer;
  background:none;
  border:none;
  color:var(--mu);
  border-bottom:3px solid transparent;
  margin-bottom:-1px;
  transition:all 0.25s;
  white-space:nowrap;
}
.tab:hover{color:var(--tx);background:rgba(255,255,255,0.03)}
.tab.on{
  color:var(--ac);
  border-bottom-color:var(--ac);
  background:linear-gradient(180deg,transparent 0%, rgba(244,208,63,0.08) 100%);
  text-shadow:0 0 12px rgba(244,208,63,0.4);
}

.content{padding:1.5rem}
.btn{
  cursor:pointer;
  border:1px solid var(--b2);
  background:transparent;
  border-radius:9999px;
  padding:8px 16px;
  font-size:11px;
  font-family:'IBM Plex Mono',monospace;
  color:var(--mu);
  text-transform:uppercase;
  letter-spacing:.06em;
  transition:all 0.2s;
}
.btn:hover{color:var(--tx);border-color:var(--ac);background:rgba(244,208,63,0.06)}
.btn-gold{
  background:linear-gradient(135deg,rgba(244,208,63,0.15),rgba(244,208,63,0.08));
  border-color:rgba(244,208,63,0.5);
  color:var(--ac);
}
.btn-gold:hover{
  background:linear-gradient(135deg,rgba(244,208,63,0.25),rgba(244,208,63,0.15));
  border-color:var(--ac);
  color:var(--ac);
  box-shadow:0 4px 16px rgba(244,208,63,0.25);
}
.stale-badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  padding:6px 14px;
  border-radius:9999px;
  background:rgba(248,113,113,0.12);
  border:1px solid rgba(248,113,113,0.4);
  color:var(--rd);
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:.05em;
  margin-left:auto;
  margin-right:8px;
  animation:staleFlash 2s infinite alternate;
}
@keyframes staleFlash{
  from{box-shadow:0 0 0 rgba(248,113,113,0)}
  to{box-shadow:0 0 16px rgba(248,113,113,0.4)}
}
.btn-pulse{
  animation:btnPulse 1.6s infinite alternate;
}
@keyframes btnPulse{
  from{box-shadow:0 4px 16px rgba(244,208,63,0.25)}
  to{box-shadow:0 4px 24px rgba(244,208,63,0.6), 0 0 0 4px rgba(244,208,63,0.1)}
}
.export-bar{display:none}

/* LOGIN */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}
.login-box{max-width:380px;width:100%;text-align:center;padding:2rem 1.5rem}
.login-title{font-family:'Bebas Neue',sans-serif;font-size:72px;color:var(--ac);line-height:1;margin-bottom:4px;background:linear-gradient(90deg,#f4d03f,#ffffff,#67e8f9);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.login-sub{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.1em;margin-bottom:1.75rem}
.login-input{width:100%;background:var(--sf);border:1px solid var(--b2);border-radius:var(--r);color:var(--tx);font-family:'IBM Plex Sans',sans-serif;font-size:15px;padding:12px 14px;text-align:center;margin-bottom:12px;transition:all 0.2s}
.login-input:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 4px rgba(244,208,63,0.18)}
.login-btn{width:100%;background:var(--ac);color:#0a0a0a;font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.05em;border:none;border-radius:var(--r);padding:12px;cursor:pointer;transition:all 0.2s;box-shadow:0 8px 30px rgba(244,208,63,0.3)}
.login-btn:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(244,208,63,0.45)}
.login-hint{font-size:11px;color:var(--mu);margin-top:14px;font-family:'IBM Plex Mono',monospace}

/* INPUTS */
.si{
  width:30px;
  height:26px;
  text-align:center;
  font-size:13px;
  font-family:'IBM Plex Mono',monospace;
  background:var(--sf2);
  border:1px solid var(--b2);
  border-radius:6px;
  color:var(--tx);
  padding:0;
  transition:all 0.25s cubic-bezier(0.4,0,0.2,1);
}
.si:focus{
  outline:none;
  border-color:var(--ac);
  box-shadow:0 0 0 4px rgba(244,208,63,0.25), 0 0 12px rgba(244,208,63,0.3);
  background:rgba(244,208,63,0.05);
}
.mr.filled .si{
  border-color:rgba(244,208,63,0.4);
  background:rgba(244,208,63,0.06);
  color:var(--ac);
  font-weight:600;
}
.sep{font-size:11px;color:var(--mu)}

/* TV BADGES */
.tv{display:inline-flex;align-items:center;font-family:'IBM Plex Mono',monospace;font-size:10px;padding:3px 8px;border-radius:9999px;font-weight:500;letter-spacing:.03em;white-space:nowrap}
.tv-m{background:rgba(244,208,63,.15);color:var(--ac);border:1px solid rgba(244,208,63,.3)}
.tv-o{background:rgba(103,232,249,.15);color:var(--ac2);border:1px solid rgba(103,232,249,.3)}

/* UTILITY CLASSES */
.mono{font-family:'IBM Plex Mono',monospace}
.u-mu{color:var(--mu)}
.u-sm{font-size:11px}.u-md{font-size:12px}.u-lg{font-size:13px}
.u-gap-10{gap:10px}
.third-check input{accent-color:var(--gr);width:16px;height:16px;cursor:pointer}
.bracket-section-label{font-size:11px;font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.1em;font-weight:600}
.bracket-section-label.gold{color:var(--ac)}
.bracket-section-label.mu{color:var(--mu)}

/* GROUPS TAB */
.tv-legend{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;padding:10px 14px;background:var(--glass);backdrop-filter:blur(16px);border-radius:var(--r);border:1px solid var(--b2);font-size:11px;color:var(--mu);font-family:'IBM Plex Mono',monospace;align-items:center}
.tz-btn{
  background:transparent;
  border:1px solid transparent;
  color:var(--mu);
  font-size:11px;
  padding:4px 10px;
  border-radius:9999px;
  cursor:pointer;
  font-weight:600;
  font-family:'IBM Plex Mono',monospace;
  transition:all 0.2s;
}
.tz-btn:hover{color:var(--tx);background:rgba(255,255,255,0.05)}
.tz-btn.on{background:rgba(244,208,63,0.15);color:var(--ac);border-color:rgba(244,208,63,0.4)}
.third-src-bar{display:flex;gap:6px;margin-bottom:12px;padding:6px;background:var(--glass);border:1px solid var(--b2);border-radius:9999px;width:fit-content}
.stats-src-bar{display:inline-flex;align-items:center;gap:6px;margin:-8px 0 14px;padding:6px 12px;background:var(--glass);border:1px solid var(--b2);border-radius:9999px}
.stats-src-label{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--mu);text-transform:uppercase;letter-spacing:.08em;margin-right:4px}
.stats-src-hint{font-size:10px;color:var(--mu);font-style:italic;margin-left:8px;font-family:'IBM Plex Mono',monospace}
.groups-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.gc{overflow:hidden}
.gh{
  padding:14px 18px;
  border-bottom:1px solid var(--b);
  display:flex;
  align-items:center;
  gap:14px;
  background:linear-gradient(180deg,rgba(244,208,63,0.04) 0%,transparent 100%);
}
.gl{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--ac);line-height:1;min-width:24px}
.gt{font-size:11px;color:var(--mu);line-height:1.6}
.mr{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:6px;
  padding:8px 12px;
  border-bottom:1px solid var(--b);
  position:relative;
  transition:all 0.25s cubic-bezier(0.4,0,0.2,1);
}
.mr:hover{background:rgba(255,255,255,0.02)}
.mr.filled{
  background:linear-gradient(90deg,rgba(244,208,63,0.05) 0%, rgba(244,208,63,0.08) 50%, rgba(244,208,63,0.05) 100%);
  border-left:2px solid var(--ac);
  padding-left:14px;
}
.mr.filled:hover{
  background:linear-gradient(90deg,rgba(244,208,63,0.08) 0%, rgba(244,208,63,0.12) 50%, rgba(244,208,63,0.08) 100%);
  box-shadow:inset 0 0 20px rgba(244,208,63,0.05);
}
/* Real-result coloring (overrides .filled when result available) */
.mr.match-win{
  border-left:2px solid var(--gr) !important;
  background:linear-gradient(90deg,rgba(74,222,128,0.06) 0%, rgba(74,222,128,0.10) 50%, rgba(74,222,128,0.06) 100%) !important;
  cursor:pointer;
}
.mr.match-win:hover{
  background:linear-gradient(90deg,rgba(74,222,128,0.10) 0%, rgba(74,222,128,0.16) 50%, rgba(74,222,128,0.10) 100%) !important;
  box-shadow:inset 0 0 20px rgba(74,222,128,0.08);
}
.mr.match-near{
  border-left:2px solid #a78bfa !important;
  background:linear-gradient(90deg,rgba(167,139,250,0.05) 0%, rgba(167,139,250,0.09) 50%, rgba(167,139,250,0.05) 100%) !important;
  cursor:pointer;
}
.mr.match-part{
  border-left:2px solid var(--ac) !important;
  background:linear-gradient(90deg,rgba(244,208,63,0.05) 0%, rgba(244,208,63,0.08) 50%, rgba(244,208,63,0.05) 100%) !important;
  cursor:pointer;
}
.mr.match-miss{
  border-left:2px solid var(--rd) !important;
  background:linear-gradient(90deg,rgba(248,113,113,0.05) 0%, rgba(248,113,113,0.08) 50%, rgba(248,113,113,0.05) 100%) !important;
  cursor:pointer;
}
.mr.match-miss:hover{
  background:linear-gradient(90deg,rgba(248,113,113,0.08) 0%, rgba(248,113,113,0.14) 50%, rgba(248,113,113,0.08) 100%) !important;
}
.mr.match-nopred{
  border-left:2px solid var(--mu) !important;
  cursor:pointer;
}
/* Result badge in top-right corner — replaces the gold check */
.mr-result{
  position:absolute;
  top:6px;
  right:8px;
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;
  font-weight:700;
  padding:2px 7px;
  border-radius:9999px;
  letter-spacing:.04em;
}
.mr.match-win .mr-result{background:rgba(74,222,128,0.18);color:var(--gr);border:1px solid rgba(74,222,128,0.5)}
.mr.match-near .mr-result{background:rgba(167,139,250,0.18);color:#a78bfa;border:1px solid rgba(167,139,250,0.5)}
.mr.match-part .mr-result{background:rgba(244,208,63,0.18);color:var(--ac);border:1px solid rgba(244,208,63,0.5)}
.mr.match-miss .mr-result{background:rgba(248,113,113,0.15);color:var(--rd);border:1px solid rgba(248,113,113,0.4)}
.mr.match-nopred .mr-result{background:rgba(187,187,187,0.1);color:var(--mu);border:1px solid rgba(187,187,187,0.3)}
.sc-near{background:rgba(167,139,250,0.08);border-left:3px solid rgba(167,139,250,0.6);padding-left:5px}
.sc-near .sc-tag{color:#a78bfa}
/* Detail row — expanded on click */
.mr-detail{
  display:flex;
  align-items:center;
  gap:12px;
  padding:8px 14px 8px 16px;
  background:rgba(0,0,0,0.2);
  border-left:2px solid transparent;
  font-size:11px;
  font-family:'IBM Plex Mono',monospace;
  border-bottom:1px solid var(--b);
  animation:detailSlide 0.2s ease-out;
}
@keyframes detailSlide{
  from{opacity:0;transform:translateY(-4px)}
  to{opacity:1;transform:translateY(0)}
}
.mr-detail-label{color:var(--mu);text-transform:uppercase;letter-spacing:.06em;font-size:10px}
.mr-detail-score{color:var(--ac);font-weight:700;font-size:14px}
.mr-detail-pts{margin-left:auto}
.mr-pts-full{color:var(--gr);font-weight:700}
.mr-pts-part{color:var(--ac);font-weight:700}
.mr-pts-zero{color:var(--rd);font-weight:700}
.mr-check{
  position:absolute;
  top:6px;
  right:8px;
  width:14px;
  height:14px;
  border-radius:50%;
  background:var(--ac);
  color:#0a0a0a;
  font-size:9px;
  font-weight:700;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 0 8px rgba(244,208,63,0.6);
  opacity:0;
  transform:scale(0.5);
  transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);
}
.mr.filled .mr-check{opacity:1;transform:scale(1)}
.mr:last-of-type{border-bottom:none}
.tn{
  font-size:12px;
  line-height:1.25;
  word-break:keep-all;
  overflow-wrap:break-word;
  hyphens:none;
  max-width:130px;
  display:inline-block;
  vertical-align:middle;
}
.tf{font-size:34px;line-height:1;flex-shrink:0}
.th{text-align:right;display:flex;align-items:center;gap:6px;justify-content:flex-end}
.ta{text-align:left;display:flex;align-items:center;gap:6px}
.sc{display:flex;flex-direction:column;align-items:center;gap:3px}
.si-row{display:flex;align-items:center;gap:3px}
.mdate{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--mu)}

/* CHAMPION TAB — premium redesign */
.champion-wrap{
  background:var(--glass);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  border:1px solid var(--b2);
  border-radius:24px;
  padding:4rem 2rem 3rem;
  text-align:center;
  position:relative;
  overflow:hidden;
  box-shadow:0 30px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(244,208,63,0.05) inset;
}
.champion-wrap::before{
  content:'';
  position:absolute;
  top:-50%;left:-50%;
  width:200%;height:200%;
  background:
    radial-gradient(circle, rgba(244,208,63,0.2) 0%, transparent 50%),
    radial-gradient(circle at 30% 70%, rgba(103,232,249,0.1) 0%, transparent 40%);
  animation:champGlow 12s infinite alternate ease-in-out;
  pointer-events:none;
  z-index:0;
}
.champion-wrap::after{
  content:'';
  position:absolute;
  top:0;left:0;right:0;
  height:2px;
  background:linear-gradient(90deg,transparent 0%,var(--ac) 50%,transparent 100%);
  opacity:0.6;
  z-index:2;
  animation:champBorderGlow 3s infinite alternate;
}
@keyframes champGlow{
  from{opacity:0.4;transform:scale(0.85) rotate(0deg)}
  to{opacity:1;transform:scale(1.15) rotate(8deg)}
}
@keyframes champBorderGlow{
  from{opacity:0.3}
  to{opacity:0.8}
}
.champion-wrap > *{position:relative;z-index:1}
.trophy-big{
  font-size:clamp(100px,18vw,180px);
  margin:0 0 1.5rem;
  filter:drop-shadow(0 0 60px rgba(244,208,63,0.7)) drop-shadow(0 20px 40px rgba(0,0,0,0.5));
  animation:trophyFloat 5s infinite alternate ease-in-out;
  display:inline-block;
  line-height:1;
}
@keyframes trophyFloat{
  0%{transform:translateY(-12px) rotate(-6deg) scale(1)}
  50%{transform:translateY(0) rotate(0deg) scale(1.03)}
  100%{transform:translateY(12px) rotate(6deg) scale(1)}
}
.champion-label{
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  color:var(--mu);
  margin-bottom:14px;
  letter-spacing:.2em;
  text-transform:uppercase;
  font-weight:600;
}
.champion-team{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(48px,7vw,88px);
  font-weight:700;
  margin:0.5rem 0 0.5rem;
  letter-spacing:.02em;
  background:linear-gradient(90deg,#f4d03f 0%,#ffffff 50%,#67e8f9 100%);
  background-size:200% auto;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  filter:drop-shadow(0 0 30px rgba(244,208,63,0.4));
  line-height:1.05;
  animation:championFade 0.8s cubic-bezier(0.4,0,0.2,1), championShimmer 6s ease-in-out infinite alternate;
}
@keyframes championShimmer{
  from{background-position:0% center}
  to{background-position:100% center}
}
@keyframes championFade{
  from{opacity:0;transform:translateY(20px) scale(0.95)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
.champion-team.placeholder{
  background:none;
  -webkit-text-fill-color:var(--mu);
  color:var(--mu);
  filter:none;
  font-size:clamp(28px,5vw,42px);
  opacity:0.6;
}
.champion-subtitle{
  font-size:13px;
  color:var(--mu);
  margin-bottom:3rem;
  font-family:'IBM Plex Mono',monospace;
}
.champion-rival{
  display:inline-flex;
  align-items:center;
  gap:10px;
  padding:8px 16px;
  margin:-1.5rem auto 2rem;
  background:rgba(0,0,0,0.3);
  border:1px solid var(--b2);
  border-radius:9999px;
  font-size:13px;
}
.champion-rival-match{border-color:rgba(74,222,128,0.4);box-shadow:0 0 14px rgba(74,222,128,0.12)}
.champion-rival-label{color:var(--mu);font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.08em}
.champion-rival-team{color:var(--tx);font-weight:600}
.champion-rival-badge{
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;
  font-weight:700;
  padding:2px 8px;
  border-radius:9999px;
  background:rgba(74,222,128,0.15);
  color:var(--gr);
  border:1px solid rgba(74,222,128,0.3);
  text-transform:uppercase;
  letter-spacing:.05em;
}
.champion-rival-badge.diff{background:rgba(244,208,63,0.12);color:var(--ac);border-color:rgba(244,208,63,0.3)}
.path{
  display:flex;
  flex-direction:column;
  gap:0.6rem;
  max-width:640px;
  margin:0 auto;
  padding-top:1rem;
}
.stage{
  display:flex;
  align-items:center;
  gap:1rem;
  background:rgba(0,0,0,0.35);
  backdrop-filter:blur(10px);
  padding:0.85rem 1.2rem;
  border-radius:12px;
  border:1px solid var(--b);
  transition:all 0.35s cubic-bezier(0.4,0,0.2,1);
  position:relative;
  overflow:hidden;
}
.stage::before{
  content:'';
  position:absolute;
  left:0;top:0;bottom:0;
  width:3px;
  background:linear-gradient(180deg,transparent,var(--mu),transparent);
  opacity:0.4;
  transition:all 0.3s;
}
.stage:hover{
  transform:translateX(8px);
  border-color:var(--ac);
  background:rgba(244,208,63,0.04);
  box-shadow:0 8px 24px rgba(244,208,63,0.12);
}
.stage:hover::before{background:linear-gradient(180deg,transparent,var(--ac),transparent);opacity:1}
.stage.has-data::before{background:linear-gradient(180deg,transparent,var(--ac2),transparent);opacity:0.7}
.stage.final{
  background:linear-gradient(135deg, rgba(244,208,63,0.12), rgba(244,208,63,0.05));
  border-color:var(--ac);
  box-shadow:0 0 40px rgba(244,208,63,0.25), 0 12px 32px rgba(0,0,0,0.3);
  padding:0.85rem 1.2rem;
}
.stage.final::before{
  background:linear-gradient(180deg,var(--ac),#ffffff,var(--ac));
  opacity:1;
  width:3px;
}
.stage-label{
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;
  color:var(--mu);
  min-width:90px;
  text-align:right;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:.08em;
  flex-shrink:0;
}
.stage.final .stage-label{
  color:var(--ac);
}
.stage-match{
  display:flex;
  align-items:center;
  gap:8px;
  flex:1;
  font-size:14px;
  font-weight:500;
  flex-wrap:nowrap;
  justify-content:center;
  color:var(--tx);
}
.stage-match .tflag-inline{font-size:22px;line-height:1}
.stage-vs{color:var(--mu);font-size:12px;font-family:'IBM Plex Mono',monospace;opacity:0.6}
.stage-score{
  font-family:'IBM Plex Mono',monospace;
  background:rgba(0,0,0,0.5);
  padding:6px 14px;
  border-radius:8px;
  font-size:14px;
  min-width:60px;
  text-align:center;
  font-weight:700;
  color:var(--ac);
  border:1px solid rgba(244,208,63,0.3);
  box-shadow:0 0 12px rgba(244,208,63,0.15);
}
.stage.final .stage-score{
  font-size:16px;
  padding:8px 18px;
  background:linear-gradient(135deg, rgba(244,208,63,0.2), rgba(244,208,63,0.1));
  border-color:var(--ac);
  box-shadow:0 0 20px rgba(244,208,63,0.3);
}
.stage-empty{color:var(--mu);font-style:italic;font-size:13px;opacity:0.6}
.champ-empty-state{
  margin-top:2.5rem;
  padding:1.5rem;
  background:rgba(255,255,255,0.02);
  border:1px dashed var(--b2);
  border-radius:14px;
  color:var(--mu);
  font-size:13px;
  font-family:'IBM Plex Mono',monospace;
  max-width:480px;
  margin-left:auto;
  margin-right:auto;
}
.champ-empty-state strong{color:var(--ac);font-weight:600}


/* STATS TAB */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-bottom:24px}
.stat-card{
  background:var(--glass);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border:1px solid var(--b2);
  border-radius:18px;
  padding:24px;
  position:relative;
  overflow:hidden;
  transition:all 0.3s cubic-bezier(0.4,0,0.2,1);
}
.stat-card:hover{border-color:rgba(244,208,63,0.4);box-shadow:0 16px 40px rgba(244,208,63,0.12);transform:translateY(-3px)}
.stat-card-feature{
  border-color:rgba(244,208,63,0.3);
  background:linear-gradient(135deg, rgba(244,208,63,0.04), var(--glass));
  box-shadow:0 8px 24px rgba(244,208,63,0.08);
}
.stat-card-feature:hover{border-color:rgba(244,208,63,0.55);box-shadow:0 20px 50px rgba(244,208,63,0.18)}
.stat-card-label{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin-bottom:14px}
.stat-card-big{font-family:'Bebas Neue',sans-serif;font-size:64px;line-height:1;color:var(--ac);letter-spacing:.02em}
.stat-card-big .suffix{font-size:26px;color:var(--mu);font-weight:400;letter-spacing:0}
.stat-card-sub{font-size:13px;color:var(--mu);margin-top:10px;line-height:1.5}
.progress-bar{height:8px;background:rgba(255,255,255,0.06);border-radius:9999px;overflow:hidden;margin:16px 0 10px;position:relative}
.progress-fill{height:100%;border-radius:9999px;background:linear-gradient(90deg,var(--gr) 0%, var(--ac) 100%);transition:width 0.6s cubic-bezier(0.4,0,0.2,1);position:relative}
.progress-fill::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.3),transparent);animation:progressShine 2.5s infinite}
@keyframes progressShine{0%{transform:translateX(-100%)}100%{transform:translateX(200%)}}
.risk-meter{
  position:relative;
  height:14px;
  background:linear-gradient(90deg,
    rgba(187,187,187,0.3) 0%,rgba(187,187,187,0.3) 30%,
    rgba(103,232,249,0.3) 30%,rgba(103,232,249,0.3) 60%,
    rgba(244,208,63,0.3) 60%,rgba(244,208,63,0.3) 80%,
    rgba(248,113,113,0.3) 80%,rgba(248,113,113,0.3) 100%);
  border-radius:9999px;
  margin:18px 0 8px;
  border:1px solid var(--b);
}
.risk-marker{
  position:absolute;
  top:-7px;
  width:4px;
  height:28px;
  background:#fff;
  border-radius:2px;

.hero-card{background:var(--glass);backdrop-filter:blur(16px);border-radius:18px;padding:22px;border:1px solid;position:relative;overflow:hidden;transition:transform 0.25s, box-shadow 0.25s}

/* LIVE TRACKER */
.live-badge{
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:6px 12px;
  background:rgba(74,222,128,0.12);
  border:1px solid rgba(74,222,128,0.4);
  border-radius:9999px;
  cursor:pointer;
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  font-weight:700;
  letter-spacing:.04em;
  color:var(--gr);
  transition:all 0.2s;
}
.live-badge:hover{background:rgba(74,222,128,0.2);box-shadow:0 0 14px rgba(74,222,128,0.3);transform:translateY(-1px)}
.live-badge.zero{background:rgba(187,187,187,0.08);border-color:rgba(187,187,187,0.3);color:var(--mu)}
.live-badge.zero:hover{background:rgba(187,187,187,0.15);box-shadow:none}
.live-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--gr);
  box-shadow:0 0 8px var(--gr);
  animation:liveBlink 1.5s infinite;
}
.live-badge.zero .live-dot{background:var(--mu);box-shadow:none;animation:none}
@keyframes liveBlink{
  0%, 100%{opacity:1}
  50%{opacity:0.4}
}
.live-section{
  background:linear-gradient(135deg, rgba(74,222,128,0.06), var(--glass));
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(74,222,128,0.3);
  border-radius:20px;
  padding:22px;
  margin-bottom:32px;
  box-shadow:0 12px 36px rgba(74,222,128,0.1);
  position:relative;
  overflow:hidden;
}
.live-section::before{
  content:'';
  position:absolute;
  top:0;left:0;right:0;
  height:2px;
  background:linear-gradient(90deg,transparent,var(--gr),transparent);
  animation:liveShimmer 3s infinite;
}
@keyframes liveShimmer{
  0%{transform:translateX(-100%)}
  100%{transform:translateX(100%)}
}
.live-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:16px;
}
.live-title{
  display:flex;
  align-items:center;
  gap:10px;
  font-family:'IBM Plex Mono',monospace;
  font-size:13px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.08em;
  color:var(--gr);
}
.live-refresh{
  background:transparent;
  border:1px solid var(--b2);
  color:var(--mu);
  padding:4px 10px;
  border-radius:9999px;
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;
  cursor:pointer;
  transition:all 0.2s;
}
.live-refresh:hover{border-color:var(--gr);color:var(--gr)}
.live-stats-row{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:16px;
  margin-bottom:18px;
}
.live-stat{padding:6px 0}
.live-stat-num{
  font-family:'Bebas Neue',sans-serif;
  font-size:42px;
  line-height:1;
  letter-spacing:.02em;
}
.live-stat-num .suffix{font-size:18px;color:var(--mu);font-weight:400;letter-spacing:0}
.live-stat-label{
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;
  color:var(--mu);
  text-transform:uppercase;
  letter-spacing:.08em;
  margin-top:6px;
}
.live-matches-scroll{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding-bottom:6px;
  scrollbar-width:thin;
}
.live-matches-scroll::-webkit-scrollbar{height:6px}
.live-matches-scroll::-webkit-scrollbar-thumb{background:var(--b2);border-radius:3px}
.live-match-card{
  flex:0 0 240px;
  display:flex;
  gap:12px;
  background:linear-gradient(135deg, rgba(0,0,0,0.35), rgba(0,0,0,0.2));
  border:1px solid var(--b2);
  border-radius:14px;
  padding:18px 20px;
  transition:transform 0.25s cubic-bezier(0.4,0,0.2,1), box-shadow 0.25s, border-color 0.25s;
  animation:liveCardFadeIn 0.3s ease-out;
}
@keyframes liveCardFadeIn{
  from{opacity:0;transform:translateY(6px)}
  to{opacity:1;transform:translateY(0)}
}
.live-match-card:hover{transform:translateY(-4px);box-shadow:0 14px 28px rgba(0,0,0,0.35);border-color:rgba(255,255,255,0.15)}
.live-match-card.win{border-color:rgba(74,222,128,0.5);box-shadow:0 0 16px rgba(74,222,128,0.18)}
.live-match-card.win:hover{transform:translateY(-4px);box-shadow:0 14px 32px rgba(74,222,128,0.32);border-color:rgba(74,222,128,0.7)}
.live-match-card.partial{border-color:rgba(244,208,63,0.45);box-shadow:0 0 14px rgba(244,208,63,0.12)}
.live-match-card.partial:hover{transform:translateY(-4px);box-shadow:0 14px 32px rgba(244,208,63,0.26);border-color:rgba(244,208,63,0.65)}
.live-match-card.zero{border-color:rgba(187,187,187,0.2)}
.live-match-card.zero:hover{transform:translateY(-4px);box-shadow:0 14px 28px rgba(0,0,0,0.35)}
.lm-result-dot{
  width:10px;
  height:10px;
  border-radius:50%;
  margin-top:6px;
  flex-shrink:0;
  background:var(--mu);
}
.lm-result-dot.win{background:var(--gr);box-shadow:0 0 10px rgba(74,222,128,0.7)}
.lm-result-dot.partial{background:var(--ac);box-shadow:0 0 10px rgba(244,208,63,0.6)}
.lm-result-dot.zero{background:var(--mu);opacity:0.4}
.lm-content{flex:1;min-width:0}
.lm-teams{
  display:flex;
  flex-direction:column;
  gap:4px;
  margin-bottom:10px;
}
.lm-team{

  align-items:center;
  gap:8px;
  font-size:13px;
}
.lm-team .flag{font-size:18px;line-height:1}

}
.lm-pred, .lm-real{

}
.lm-label{

  font-size:9px;
  text-transform:uppercase;
  letter-spacing:.06em;
  margin-bottom:2px;
}
.lm-score{

  font-size:13px;

}

.lm-pts{

.lm-pts.zero{color:var(--mu);opacity:0.5}
/* Next-match timer in live header */
.live-timer{
  display:flex;

}

@media(max-width:600px){

// ── API ACCESS ──────────────────────────────────────────────────────────
// football-data.org sends NO CORS headers, so the browser can't call it
// directly from a github.io page — a proxy is required.
//
// CURRENT SETUP: public allorigins proxy in ANONYMOUS mode.
//   IMPORTANT: no public keyless proxy (allorigins, corsproxy, etc.) can
//   forward a custom header, so the X-Auth-Token CANNOT be delivered through
//   one — and putting the key in the URL would leak it into proxy logs and
//   Referer, which is exactly what we're avoiding. So we DON'T send the key
//   at all and rely on football-data's anonymous tier (~10 req/min shared
//   across everyone using the proxy). Fine for "refresh the table once a day",
//   but expect occasional failures on match days when the shared limit is hot.
//   The apikey input in the Standings tab is therefore currently cosmetic for
//   the proxy path — it's only used by the direct-call fallback below.
//
//   THREAT NOTE: a public proxy can still see and tamper with the *response*.
//   That's covered defensively — every API-derived field is run through esc()
//   before it touches innerHTML, so a malicious proxy can't inject script.
//

// Cloudflare Worker that holds the key server-side and adds CORS, then set

//

const USE_WORKER   = true;   // Worker deployed — key lives server-side
const WORKER_PROXY = 'https://wc2026-fd.t47n7wwnv4.workers.dev/?u=';
// allorigins /raw returns the upstream body verbatim with CORS headers.
const ALLORIGINS   = 'https://api.allorigins.win/raw?url=';

// Build the fetch for a football-data.org endpoint.
// Worker mode: key lives server-side, nothing sensitive leaves the browser.
// Proxy mode (default): anonymous request through allorigins, no key sent.
// Direct fallback: only reachable if you self-host where CORS is already
// bypassed (e.g. a browser extension) — there the stored key is used.
function fdFetch(apiUrl, apiKey){
  if(USE_WORKER && !WORKER_PROXY.includes('YOUR-SUBDOMAIN')){
    return fetch(`${WORKER_PROXY}${encodeURIComponent(apiUrl)}`);
  }
  if(location.protocol === 'http:' || location.protocol === 'https:'){
    // Anonymous proxy path — no token (can't be delivered safely anyway).
    return fetch(`${ALLORIGINS}${encodeURIComponent(apiUrl)}`);
  }
  // Self-host / extension fallback: direct call with key in header.
  return fetch(apiUrl, {headers:{'X-Auth-Token':apiKey}});
}

function onScoreInput(inputEl, mid, side){
  ls(mid+'_'+side, inputEl.value);
  markGroupsChanged();
  const row = inputEl.closest('.mr');
  if(!row) return;
  const inputs = row.querySelectorAll('.si');
  const filled = [...inputs].every(i => i.value !== '');
  if(filled && !row.classList.contains('filled')){
    row.classList.add('filled');
    if(!row.querySelector('.mr-check')){
      const check = document.createElement('div');
      check.className = 'mr-check';
      check.textContent = '✓';
      row.insertBefore(check, row.firstChild);
    }
  } else if(!filled && row.classList.contains('filled')){
    row.classList.remove('filled');
    const c = row.querySelector('.mr-check');
    if(c) c.remove();
  }
}


function fuzzyMatch(a, b){
  if(!a || !b) return false;
  const al = a.toLowerCase(), bl = b.toLowerCase();
  return al.includes(bl.slice(0, FUZZY_MATCH_LEN)) || bl.includes(al.slice(0, FUZZY_MATCH_LEN));
}

function nsk(msk){
  const [h,m] = msk.split(':').map(Number);
  const nh = (h + NSK_OFFSET) % 24;
  return String(nh).padStart(2,'0')+':'+String(m).padStart(2,'0');
}

// Convert "HH:MM" MSK + date string ("11 июн") into the user's local timezone.
// We need a full Date for that, so we map RU month names → numbers.
// All matches are in 2026.
const RU_MONTHS = {'июн':5,'июл':6,'авг':7};
function localTime(msk, dateStr){
  try{
    const m = dateStr.match(/(\d+)\s+(\S+)/);
    if(!m) return msk;
    const day = +m[1];
    const month = RU_MONTHS[m[2].slice(0,3).toLowerCase()];
    if(month === undefined) return msk;
    const [h, min] = msk.split(':').map(Number);
    // MSK is UTC+3. Construct UTC equivalent: subtract 3 hours.
    const utc = new Date(Date.UTC(2026, month, day, h - 3, min));
    return utc.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', hour12:false});
  }catch(e){return msk;}
}

// Render the match time in the user's local timezone. We start from the MSK
// time stored alongside each match and convert via UTC.
function fmtMatchTime(msk, dateStr){
  return localTime(msk, dateStr);
}

  try { twemoji.parse(node, {folder:'svg', ext:'.svg'}); } catch(e){}
}

// ── HTML escaping for untrusted strings ──
// Anything that came from an imported JSON (other player's file, restored
// backup) or from contenteditable team-name fields is untrusted: it ends up
// interpolated into innerHTML templates. esc() neutralizes & < > " so a
// crafted "prediction" file can't execute script in the victim's page
// (which would expose their localStorage incl. the API key).
// NOTE: apostrophe is deliberately NOT escaped — real team names contain it
// ("Кот-д'Ивуар") and escaping would break string comparisons against
// FAVORITES / RU_NAME_MAP / real API data. All attribute interpolations in
// our templates are double-quoted, so a bare apostrophe is inert.
function esc(s){
  return String(s ?? '').replace(/[&<>"]/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'
  })[c]);
}

// ── Second-player data with parse cache ──
// The imported JSON is ~50 KB; compare views call getOtherPred/getOtherBk
// hundreds of times per render. Parse once, invalidate on import/removal.
let _otherCache; // undefined = not loaded yet, null = no data, object = parsed
function otherInvalidate(){ _otherCache = undefined; }
function getOther(){
  if(_otherCache !== undefined) return _otherCache;
  try{
    const raw = localStorage.getItem('wc26_other_data');
    _otherCache = raw ? JSON.parse(raw) : null;
  }catch(e){ _otherCache = null; }
  return _otherCache;
}

function getOtherPred(key){
  const o = getOther();
  // scores are digits; esc() is a no-op for them but protects against
  // a crafted file putting markup into a "score" field
  return o ? esc((o.data||{})[key] ?? '') : '';
}

// Get other player's bracket-slot field (t1n, t1s, etc).
// Returns empty string if not set. Escaped: this data comes from an
// imported file and flows straight into innerHTML templates.
function getOtherBk(slotId, key){
  const o = getOther();
  return o ? esc((o.bk?.[slotId]?.[key]) ?? '') : '';
}

// Other player's display name (from the imported JSON). Escaped.
function getOtherName(){
  const o = getOther();
  return esc((o && o.name) || 'Соперник');
}

// True if friend's JSON is loaded
function hasOther(){
  return getOther() !== null;
}

function calcStd(gid,src){
  const g=GD[gid];
  const st=g.t.map((_,i)=>({i,pts:0,w:0,d:0,l:0,gf:0,ga:0,pl:0}));
  g.m.forEach(([hi,ai],mi)=>{
    let gh,ga;
    if(src==='real'){
      const rd=realData[gid];if(!rd)return;
      const matchName=(a,b)=>fuzzyMatch(a,b);
      const hr=rd.find(x=>matchName(g.t[hi][1],x.name));
      const ar=rd.find(x=>matchName(g.t[ai][1],x.name));
      if(!hr||!ar)return;
      gh=hr.gf;ga=hr.ga;
    } else {
      const mid=`g${gid}_${mi}`;
      const rh=src==='other'?getOtherPred(mid+'_h'):lg(mid+'_h');
      const ra=src==='other'?getOtherPred(mid+'_a'):lg(mid+'_a');
      gh=parseInt(rh);ga=parseInt(ra);
      if(isNaN(gh)||isNaN(ga))return;
    }
    st[hi].gf+=gh;st[hi].ga+=ga;st[hi].pl++;
    st[ai].gf+=ga;st[ai].ga+=gh;st[ai].pl++;
    if(gh>ga){st[hi].pts+=3;st[hi].w++;st[ai].l++;}
    else if(gh===ga){st[hi].pts++;st[hi].d++;st[ai].pts++;st[ai].d++;}
    else{st[ai].pts+=3;st[ai].w++;st[hi].l++;}
  });
  return st.sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf);
}

function diffCell(v){
  const c=v>0?'dp':v<0?'dn':'dz';

function sdot(pos){
  const c=pos<=1?'s1':pos===2?'s2':'s3';
  return `<span class="sdot ${c}"></span>`;
}

}

    body.innerHTML=`<div class="std-glabel">Группа ${gid} <span class="cb cb-m">ты</span> <span style="color:var(--mu)">vs</span> <span class="cb cb-t">2-й</span></div>

  } else {
    if(!realData[gid]){body.innerHTML=`<div class="no-data">Нажми "Обновить реальные" — данные с football-data.org появятся после первого матча</div>`;return;}
    const t=GD[gid].t, me=calcStd(gid,'me'), real=realData[gid];
    const normalizedReal = (real||[]).map((row,pos) => ({...row, ruNm: ruName(row.name)||row.name, realPos: pos}));
    const findReal = n => normalizedReal.find(x => x.ruNm === n || fuzzyMatch(n, x.ruNm));

    // How many matches played in this group (from real data)
    const played = normalizedReal.reduce((mx,r) => Math.max(mx, r.pl||0), 0);
    const total = GD[gid].m.length / GD[gid].t.length * 2; // matches per team
    const progressNote = played < total
      ? `<span style="font-size:10px;color:var(--mu);font-family:'IBM Plex Mono',monospace"> · после ${played} из ${total} матчей</span>`
      : '';

    // Sort real by actual standings position
    const realSorted = [...normalizedReal].sort((a,b) => b.pts-a.pts || (b.gf-b.ga)-(a.gf-a.ga));

    // Build rows: for each REAL position show team + my predicted position
    const rows = realSorted.map((rd, realPos) => {
      // Find where I predicted this team to finish
      const myPos = me.findIndex(r => t[r.i][1] === rd.ruNm);
      const myPlace = myPos === -1 ? null : myPos + 1;
      const correct = myPlace !== null && myPlace === realPos + 1;
      const posIcon = myPlace === null ? '—'
        : correct ? `<span style="color:var(--gr);font-weight:700">${myPlace}-е ✓</span>`
        : `<span style="color:var(--rd)">${myPlace}-е ✗</span>`;
      const flag = t.find(([f,n]) => n === rd.ruNm)?.[0] || '';
      const placeLabel = `${realPos+1}-е`;
      // esc(): ruNm/pts can fall back to raw football-data.org fields (proxied
      // through a third party) — neutralize before innerHTML.
      return `<div class="real-row${correct?' real-row-ok':''}">
        <span class="real-place">${placeLabel}</span>
        <span class="real-flag">${flag}</span>
        <span class="real-name">${esc(rd.ruNm)}</span>
        <span class="real-pts">${esc(rd.pts)} оч</span>
        <span class="real-pred">${posIcon}</span>
      </div>`;
    }).join('');

    body.innerHTML=`<div class="std-glabel">
        Группа ${gid} ${progressNote}
      </div>
      <div class="real-legend">
        <span style="color:var(--mu);font-size:11px;font-family:'IBM Plex Mono',monospace">Реальная таблица · Твой прогноз</span>
      </div>
      <div class="real-rows">${rows}</div>`;
  }
}

async function fetchReal(){
  const apiKey=localStorage.getItem('wc26_apikey')||'';
  if(!USE_WORKER && !apiKey){toast('Введи API ключ','err');return;}
  const btn=document.getElementById('rfbtn');
  btn.classList.add('loading');
  try{
    const apiUrl='https://api.football-data.org/v4/competitions/2000/standings';
    const r=await fdFetch(apiUrl, apiKey);
    if(!r.ok)throw new Error('HTTP '+r.status);
    const json=await r.json();
    if(json.errorCode)throw new Error(json.message);
    // Clear any stale keys (e.g. "Group A" from old cache) before writing fresh ones
    Object.keys(realData).forEach(k => { if(k.length > 1) delete realData[k]; });
    json.standings.forEach(sg=>{
      // API returns group as "Group A", "Group B", etc.
      // Extract the single letter at the end.
      const raw = sg.group || sg.stage || '';
      const gid = raw.match(/([A-L])$/)?.[1];
      if(!gid) return;
      realData[gid]=sg.table.map(row=>({name:row.team.shortName||row.team.name,pts:row.points,gf:row.goalsFor,ga:row.goalsAgainst,pl:row.playedGames}));
    });
    localStorage.setItem('wc26_real',JSON.stringify(realData));
    curStdView='real';
    renderStandings();
    toast('✓ Реальные данные загружены');
  }catch(e){
    toast('Ошибка: '+e.message,'err');
    document.getElementById('std-body').innerHTML=`<div class="no-data" style="color:var(--rd)">Данные недоступны: ${e.message}<br><span style="color:var(--mu);font-size:11px">ЧМ начнётся 11 июня — до этого реальных данных нет</span></div>`;
  }finally{btn.classList.remove('loading');}
}

/* ═══════════════════════════════════════════════════════
   BRACKET (per-user: wc26_<USER>_bk)
   Fix #2: bracket data is now namespaced per user
   Fix #4: real bracket matches are mapped by team names, not index
   ═══════════════════════════════════════════════════════ */
// ── Bracket storage with parse cache ──
// bkGet is on the hot path: one renderBracket() calls it ~200 times
// (32 slots × ~6 fields), and re-render happens on every keystroke in the
// playoff grid. Parsing the whole bracket JSON from localStorage on every
// call is O(n²) work per render. We cache the parsed object and invalidate
// on every write (bkUpd) or external restore (bkInvalidate).
let _bkCache = null;
function bkInvalidate(){ _bkCache = null; }
function bkGet(id,k){
  try{
    if(_bkCache === null) _bkCache = JSON.parse(localStorage.getItem(lk('bk'))||'{}');
    // esc(): team names come from contenteditable / restored backup files and
    // are interpolated into innerHTML. Digits/emoji/pen pass through unchanged.
    return esc((_bkCache[id]||{})[k]||'');
  }catch(e){ _bkCache = {}; return ''; }
}
function bkUpd(id,k,v){
  try{
    const key=lk('bk');
    const d=JSON.parse(localStorage.getItem(key)||'{}');
    if(!d[id])d[id]={};
    d[id][k]=v;
    localStorage.setItem(key,JSON.stringify(d));
    _bkCache = d; // keep cache warm with the fresh object
    clearTimeout(saveTimer);
    saveTimer=setTimeout(()=>toast('✓ Сохранено'), SAVE_DEBOUNCE_MS);
  }catch(e){ bkInvalidate(); }
}

// Set penalty winner for a tied knockout match. Re-renders bracket.
function setPenWinner(e, slotId, winnerSide){
  e.stopPropagation();
  const current = bkGet(slotId, 'pen');
  // Toggle: clicking the same side clears the pick
  const next = current === winnerSide ? '' : winnerSide;
  bkUpd(slotId, 'pen', next);
  renderBracket();
}

// Re-render bracket after losing focus on a score input.
// We don't re-render on every keystroke (would steal focus), so we wait for blur.
function checkTieOnBlur(inputEl, slotId){
  // Small delay so the value is committed
  setTimeout(() => {
    const card = inputEl.closest('.mc');
    if(!card) return;
    const t1s = bkGet(slotId, 't1s');
    const t2s = bkGet(slotId, 't2s');
    const isTie = t1s !== '' && t2s !== '' && +t1s === +t2s;
    const hasTieClass = card.querySelector('.tie-clickable');
    const hasHint = card.querySelector('.mc-tie-hint');
    // Re-render only if state changed
    if(isTie !== !!hasTieClass || (isTie && !hasHint && !bkGet(slotId,'pen'))){
      renderBracket();
    }
  }, 50);
}


/* ═══════════════════════════════════════════════════════
   AUTOFILL ROUND OF 32 — official FIFA logic
   Computes standings → picks 1st/2nd from each group → ranks 12 thirds →
   distributes top 8 thirds to their assigned R32 slots
   ═══════════════════════════════════════════════════════ */
function autoFillRoundOf32(){
  // 1. Check if all groups have at least some predictions
  const filledCount = Object.keys(GD).reduce((n,gid) => {
    const matches = GD[gid].m.filter((_,i) => lg(`g${gid}_${i}_h`) !== '' && lg(`g${gid}_${i}_a`) !== '');
    return n + matches.length;
  }, 0);

  if(filledCount < TOTAL_GROUP_MATCHES){
    if(!confirm(`Заполнено только ${filledCount} из ${TOTAL_GROUP_MATCHES} матчей группового этапа.\n\nАвтозаполнение будет неполным. Продолжить?`)) return;
  } else {
    if(!confirm('Перезаписать все 16 матчей 1/32 финала по твоим прогнозам?')) return;
  }

  // 2. Compute standings for each group
  const standings = {};
  GKEYS.forEach(gid => { standings[gid] = calcStd(gid, 'me'); });

  // 3. Helper: get team [flag, name] at given position in group
  const getTeam = (gid, pos) => {
    const rows = standings[gid];
    if(!rows || rows.length <= pos) return null;
    return GD[gid].t[rows[pos].i]; // [flag, name]
  };

  // 4. Rank all 12 third-place teams to pick top 8
  const allThirds = GKEYS
    .map(gid => {
      const r = standings[gid][2];
      if(!r) return null;
      return {gid, pts:r.pts, diff:r.gf-r.ga, gf:r.gf, team:GD[gid].t[r.i]};
    })
    .filter(Boolean)
    .sort((a,b) => b.pts - a.pts || b.diff - a.diff || b.gf - a.gf);

  const top8Groups = new Set(allThirds.slice(0, THIRD_PLACE_QUOTA).map(t => t.gid));
  const top8TeamByGroup = new Map();
  allThirds.slice(0, THIRD_PLACE_QUOTA).forEach(t => top8TeamByGroup.set(t.gid, t.team));

  // 5. Pre-resolve third-place assignments via backtracking
  // so that each of 8 third-place slots receives a unique group from the top-8.
  // Order slots by spec restrictiveness (fewer allowed groups first) for stable pairing.
  const allSlots = [...BK.LR32, ...BK.RR32];
  const thirdSlots = allSlots.filter(s => s.s1.third || s.s2.third);

  // For each third-slot, store its allowed groups intersected with top-8
  const slotCandidates = thirdSlots.map(slot => {
    const spec = slot.s1.third ? slot.s1 : slot.s2;
    const side = slot.s1.third ? 1 : 2;
    return {
      slotId: slot.id,
      side,
      allowed: spec.third.filter(g => top8Groups.has(g))
    };
  });

  // Backtracking assignment: find any permutation that matches all 8 slots
  const thirdAssignment = {}; // slotId+side -> group
  function backtrack(idx, usedGroups){
    if(idx === slotCandidates.length) return true;
    const sc = slotCandidates[idx];
    for(const g of sc.allowed){
      if(usedGroups.has(g)) continue;
      usedGroups.add(g);
      thirdAssignment[sc.slotId + ':' + sc.side] = g;
      if(backtrack(idx + 1, usedGroups)) return true;
      usedGroups.delete(g);
      delete thirdAssignment[sc.slotId + ':' + sc.side];
    }
    return false;
  }
  backtrack(0, new Set());

  // 6. Resolve a single side of a slot
  const resolveSide = (slot, side) => {
    const spec = side === 1 ? slot.s1 : slot.s2;
    if(spec.win) return getTeam(spec.win, 0);
    if(spec.run) return getTeam(spec.run, 1);
    if(spec.third){
      const gid = thirdAssignment[slot.id + ':' + side];
      if(gid) return top8TeamByGroup.get(gid);
      return null;
    }
    return null;
  };

  // 7. CLEAR all 16 R32 slots first, then apply.
  // Without this clearing, stale teams from a previous autoFill linger when
  // resolveSide returns null for a now-empty slot.
  let filled = 0, skipped = 0;
  allSlots.forEach(slot => {
    ['t1f','t1n','t2f','t2n','t1s','t2s','pen'].forEach(k => bkUpd(slot.id, k, ''));
  });
  allSlots.forEach(slot => {
    const t1 = resolveSide(slot, 1);
    const t2 = resolveSide(slot, 2);
    if(t1){
      bkUpd(slot.id, 't1f', t1[0]);
      bkUpd(slot.id, 't1n', t1[1]);
      filled++;
    } else { skipped++; }
    if(t2){
      bkUpd(slot.id, 't2f', t2[0]);
      bkUpd(slot.id, 't2n', t2[1]);
      filled++;
    } else { skipped++; }
  });

  // Save timestamp of this autofill for staleness check
  localStorage.setItem(lk('bk_autofilled_at'), Date.now().toString());
  toast(`✓ Заполнено ${filled}/32 слотов${skipped?', '+skipped+' пропущено':''}`);
  renderBracket();
}

/* ═══════════════════════════════════════════════════════
   AUTO-ADVANCE WINNERS — cascade winners through bracket
   L32 → L16 → QF → SF → FIN
   ═══════════════════════════════════════════════════════ */
// Resolve a single bracket slot to a decisive outcome.
// `reader` is a function (slotId, field) → string — pass `bkGet` for own data
// or `getOtherBk` for friend data.
// Returns {winner: {flag,name}, loser: {flag,name}} or null if undecided.
function getSlotOutcome(slotId, reader){
  const t1s = reader(slotId, 't1s');
  const t2s = reader(slotId, 't2s');
  if(t1s === '' || t2s === '') return null;
  const t1n = reader(slotId, 't1n');
  const t2n = reader(slotId, 't2n');
  if(!t1n || !t2n || t1n === 'TBD' || t2n === 'TBD') return null;
  const a = +t1s, b = +t2s;
  const team1 = {flag: reader(slotId, 't1f') || '·', name: t1n};
  const team2 = {flag: reader(slotId, 't2f') || '·', name: t2n};
  if(a === b){
    const pen = reader(slotId, 'pen');
    if(pen === '1') return {winner: team1, loser: team2};
    if(pen === '2') return {winner: team2, loser: team1};
    return null; // undecided tie
  }
  return a > b ? {winner: team1, loser: team2} : {winner: team2, loser: team1};
}

function autoAdvanceWinners(){
  if(!confirm('Прокинуть победителей по всей сетке плейофф?\n\nТекущие команды в 1/16, 1/8, 1/4, 1/2 и финале будут перезаписаны (счета сохранятся).')) return;

  // Step 1: chain map — which match feeds which (left half + right half)
  // L32_1 + L32_2 → L16_1   (M89: winner M74 vs M77)
  // L32_3 + L32_4 → L16_2   (M90: winner M73 vs M75)
  // L32_5 + L32_6 → L16_3   (M91: winner M76 vs M78)
  // L32_7 + L32_8 → L16_4   (M92: winner M79 vs M80)
  // L16_1 + L16_2 → LQF_1, L16_3 + L16_4 → LQF_2
  // LQF_1 + LQF_2 → LSF_1
  // Right half mirrors.
  // LSF_1 + RSF_1 → FIN

  const chain = [
    // R32 → R16
    {to:'L16_1', from:['L32_1','L32_2']},
    {to:'L16_2', from:['L32_3','L32_4']},
    {to:'L16_3', from:['L32_5','L32_6']},
    {to:'L16_4', from:['L32_7','L32_8']},
    {to:'R16_1', from:['R32_1','R32_2']},
    {to:'R16_2', from:['R32_3','R32_4']},
    {to:'R16_3', from:['R32_5','R32_6']},
    {to:'R16_4', from:['R32_7','R32_8']},
    // R16 → QF
    {to:'LQF_1', from:['L16_1','L16_2']},
    {to:'LQF_2', from:['L16_3','L16_4']},
    {to:'RQF_1', from:['R16_1','R16_2']},
    {to:'RQF_2', from:['R16_3','R16_4']},
    // QF → SF
    {to:'LSF_1', from:['LQF_1','LQF_2']},
    {to:'RSF_1', from:['RQF_1','RQF_2']},
    // SF → FIN
    {to:'FIN', from:['LSF_1','RSF_1']},
    // SF losers → 3rd place
    {to:'P3', from:['LSF_1','RSF_1'], losers:true}
  ];

  let advanced = 0, missing = 0;
  chain.forEach(link => {
    // Resolve both source slots via shared helper; if losers flag set, take losers.
    const out1 = getSlotOutcome(link.from[0], bkGet);
    const out2 = getSlotOutcome(link.from[1], bkGet);
    const t1 = out1 ? (link.losers ? out1.loser : out1.winner) : null;
    const t2 = out2 ? (link.losers ? out2.loser : out2.winner) : null;

    // Clear stale score if the team in this slot is changing
    const oldT1n = bkGet(link.to, 't1n');
    const oldT2n = bkGet(link.to, 't2n');
    if(t1 && oldT1n !== t1.name){
      bkUpd(link.to, 't1s', '');
      bkUpd(link.to, 'pen', '');
    }
    if(t2 && oldT2n !== t2.name){
      bkUpd(link.to, 't2s', '');
      bkUpd(link.to, 'pen', '');
    }
    if(t1){bkUpd(link.to,'t1f',t1.flag);bkUpd(link.to,'t1n',t1.name);advanced++;} else missing++;
    if(t2){bkUpd(link.to,'t2f',t2.flag);bkUpd(link.to,'t2n',t2.name);advanced++;} else missing++;
  });

  toast(`✓ Прокинуто ${advanced} команд${missing?', '+missing+' пропущено (нет счёта или ничья)':''}`);
  renderBracket();
}

// Track when groups were last modified — for staleness detection
function markGroupsChanged(){
  localStorage.setItem(lk('groups_changed_at'), Date.now().toString());
}

// Check if bracket R32 is stale relative to current group predictions
function isBracketStale(){
  const filled = +(localStorage.getItem(lk('bk_autofilled_at')) || 0);
  const changed = +(localStorage.getItem(lk('groups_changed_at')) || 0);
  return filled > 0 && changed > filled;
}
// (duplicate getOtherBk removed — single cached implementation lives near getOtherPred)

// Fix #4: match real bracket data to BK slot by team names
function findRealMatch(slot){
  const t1n = (bkGet(slot.id, 't1n') || slot.t1 || '').toLowerCase();
  const t2n = (bkGet(slot.id, 't2n') || slot.t2 || '').toLowerCase();
  if(!t1n || !t2n || t1n.length < TEAM_NAME_MIN_LEN || t2n.length < TEAM_NAME_MIN_LEN) return null;
  // Filter API matches by stage to avoid 1/16 matching with QF etc.
  const expectedStages = Object.entries(PLAYOFF_STAGE_KEY)
    .filter(([_, prefixes]) => prefixes.some(p => slot.id.startsWith(p)))
    .map(([stage]) => stage);
  for(const matchId in realBracket){
    const m = realBracket[matchId];
    if(expectedStages.length && !expectedStages.includes(m.stage)) continue;
    if((fuzzyMatch(m.home, t1n) && fuzzyMatch(m.away, t2n)) ||
       (fuzzyMatch(m.home, t2n) && fuzzyMatch(m.away, t1n))) return m;
  }
  return null;
}

function mcCard(m,isGold,isBronze,mode){
  const cls=isGold?'mc gold':isBronze?'mc bronze':'mc';
  const lbl=isGold?'🏆 Финал · 19 июл':isBronze?'🥉 3-е место · 18 июл':m.id.replace('_',' ');

  if(mode==='me'){
    const t1n=bkGet(m.id,'t1n')||m.t1||'TBD',t2n=bkGet(m.id,'t2n')||m.t2||'TBD';
    const t1f=bkGet(m.id,'t1f')||'·',t2f=bkGet(m.id,'t2f')||'·';
    const t1s=bkGet(m.id,'t1s'),t2s=bkGet(m.id,'t2s');
    const filled = t1s!=='' && t2s!=='';
    // Tie detection: scores filled and equal
    const isTie = filled && (+t1s === +t2s);
    const penWinner = bkGet(m.id, 'pen'); // '1' = t1 won pen, '2' = t2 won pen, '' = not set
    const t1PenClass = (isTie && penWinner==='1') ? ' pen-winner' : '';
    const t2PenClass = (isTie && penWinner==='2') ? ' pen-winner' : '';
    const tieClickable = isTie ? ' tie-clickable' : '';

    // NOTE: second-player comparison intentionally lives ONLY in the "Сравнение"
    // mode (compare bracket view). The "Мой прогноз" tab stays clean — no chips,
    // no hints — because in narrow rounds the hints overflow and break alignment.

    return `<div class="${cls}${filled?' mc-filled':''}">
      <div class="mc-lbl">${lbl}</div>
      <div class="mc-t${tieClickable}${t1PenClass}" ${isTie?`onclick="setPenWinner(event,'${m.id}','1')"`:''}><span class="mc-flag" contenteditable spellcheck="false" oninput="bkUpd('${m.id}','t1f',this.textContent.trim())" onclick="event.stopPropagation()">${t1f}</span><span class="mc-name" contenteditable spellcheck="false" oninput="bkUpd('${m.id}','t1n',this.textContent.trim())" onclick="event.stopPropagation()">${t1n}</span><input type="number" class="mc-s" min="0" max="30" placeholder="–" value="${bkGet(m.id,'t1s')}" oninput="bkUpd('${m.id}','t1s',this.value)" onblur="checkTieOnBlur(this,'${m.id}')" onclick="event.stopPropagation()"></div>

}

function connSVG(n,sh,dir){
  const pairs=Math.floor(n/2),W=20,H=n*sh;
  let p='';
  for(let i=0;i<pairs;i++){
    const y1=i*2*sh+sh/2,y2=(i*2+1)*sh+sh/2,mid=(y1+y2)/2;
    if(dir==='right'){p+=`<line x1="20" y1="${y1}" x2="10" y2="${y1}"/><line x1="20" y1="${y2}" x2="10" y2="${y2}"/><line x1="10" y1="${y1}" x2="10" y2="${y2}"/><line x1="10" y1="${mid}" x2="0" y2="${mid}"/>`;}
    else{p+=`<line x1="0" y1="${y1}" x2="10" y2="${y1}"/><line x1="0" y1="${y2}" x2="10" y2="${y2}"/><line x1="10" y1="${y1}" x2="10" y2="${y2}"/><line x1="10" y1="${mid}" x2="20" y2="${mid}"/>`;}
  }
  return `<svg width="${W}" height="${H}" style="display:block;margin-top:28px;flex-shrink:0"><g fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1">${p}</g></svg>`;
}

function bRound(label,matches,sh,w,mode){
  const H=matches.length*sh;
  let h=`<div class="bround" style="width:${w||162}px"><div class="bhead" style="width:${w||162}px">${label}</div><div class="bslots" style="height:${H}px">`;
  matches.forEach(m=>{h+=`<div class="bslot" style="height:${sh}px">${mcCard(m,m.id==='FIN',m.id==='P3',mode)}</div>`;});

}

function ruName(apiName){
  if(!apiName) return null;
  if(RU_NAME_MAP[apiName]) return RU_NAME_MAP[apiName];
  // Try fuzzy: find our team whose first 4 letters match
  const lo = apiName.toLowerCase();
  for(const [gid, g] of Object.entries(GD)){
    for(const [, name] of g.t){
      if(name.toLowerCase().slice(0,4) === lo.slice(0,4)) return name;
    }
  }
  return apiName; // fall back as-is
}

// Fetch every played match (group + playoff) into a single list
async function fetchRealMatches(silent){
  const apiKey=localStorage.getItem('wc26_apikey')||'';
  if(!USE_WORKER && !apiKey){
    if(!silent) toast('Нужен API ключ во вкладке Таблица','err');
    return;
  }
  try{
    const apiUrl='https://api.football-data.org/v4/competitions/2000/matches';
    const r=await fdFetch(apiUrl, apiKey);
    if(!r.ok)throw new Error('HTTP '+r.status);
    const json=await r.json();
    const all = json.matches || [];
    realMatches = all
      .filter(m => m.status === 'FINISHED' && m.score?.fullTime)
      .map(m => ({
        utc: m.utcDate,
        stage: m.stage,
        group: m.group ? (m.group.match(/([A-L])$/)?.[1] || null) : null,
        home: ruName(m.homeTeam?.shortName || m.homeTeam?.name),
        away: ruName(m.awayTeam?.shortName || m.awayTeam?.name),
        hs: m.score.fullTime.home,
        as: m.score.fullTime.away
      }))
      .sort((a,b) => new Date(b.utc) - new Date(a.utc));
    // Upcoming matches: scheduled or timed, kept for "next match" timer
    upcomingMatches = all
      .filter(m => (m.status === 'SCHEDULED' || m.status === 'TIMED' || m.status === 'IN_PLAY' || m.status === 'PAUSED') && m.utcDate)
      .map(m => ({
        utc: m.utcDate,
        stage: m.stage,
        group: m.group ? (m.group.match(/([A-L])$/)?.[1] || null) : null,
        home: ruName(m.homeTeam?.shortName || m.homeTeam?.name),
        away: ruName(m.awayTeam?.shortName || m.awayTeam?.name),
        status: m.status
      }))
      .sort((a,b) => new Date(a.utc) - new Date(b.utc));
    localStorage.setItem('wc26_real_matches', JSON.stringify(realMatches));
    localStorage.setItem('wc26_upcoming_matches', JSON.stringify(upcomingMatches));
    liveAutoRefreshAt = Date.now();
    updateLiveBadge();
    if(!silent) toast(`✓ Реальные матчи: ${realMatches.length}`);
  }catch(e){
    if(!silent) toast('Ошибка: '+e.message,'err');
  }
}

// Score a single real match against user prediction.
// Returns {pts, kind:'full'|'part'|'zero', myH, myA} or null if no prediction exists.
function scoreRealMatch(rm){
  // Find this match in user's group predictions
  if(!rm.group) return null;
  const g = GD[rm.group];
  if(!g) return null;
  for(let i=0;i<g.m.length;i++){
    const [hi, ai] = g.m[i];
    const hn = g.t[hi][1], an = g.t[ai][1];
    // Match either home-home or swapped (data orderings can differ)
    // Normalize API names via ruName() before comparing with local GD names
    const rmHome = ruName(rm.home) || rm.home;
    const rmAway = ruName(rm.away) || rm.away;
    const direct = (hn === rmHome && an === rmAway) || fuzzyMatch(hn, rmHome) && fuzzyMatch(an, rmAway);
    const swapped = (hn === rmAway && an === rmHome) || fuzzyMatch(hn, rmAway) && fuzzyMatch(an, rmHome);
    if(!direct && !swapped) continue;
    const mid = `g${rm.group}_${i}`;
    const myH = lg(mid+'_h'), myA = lg(mid+'_a');
    if(myH === '' || myA === '') return null;
    // Normalize prediction to match data orientation
    const myHome = direct ? +myH : +myA;
    const myAway = direct ? +myA : +myH;
    if(myHome === rm.hs && myAway === rm.as){
      return {pts: POINTS_EXACT, kind:'full', myH: myHome, myA: myAway};
    }
    const myOut = myHome === myAway ? 'D' : (myHome > myAway ? 'H' : 'A');
    const realOut = rm.hs === rm.as ? 'D' : (rm.hs > rm.as ? 'H' : 'A');
    if(myOut === realOut){
      // Winner correct — check if score is close (total goal diff ≤ 1)
      const scoreDiff = Math.abs(myHome - rm.hs) + Math.abs(myAway - rm.as);
      const kind = scoreDiff <= 1 ? 'near' : 'part';
      const pts = scoreDiff <= 1 ? POINTS_NEAR : POINTS_OUTCOME;
      return {pts, kind, myH: myHome, myA: myAway};
    }
    return {pts: 0, kind:'zero', myH: myHome, myA: myAway};
  }
  return null;
}

// Reverse lookup: given a group + match index, return the real match data
// and scoring info (or null if no real result yet).
// Returns {realH, realA, pts, kind} where kind is 'full'|'part'|'zero'
// or null if the match hasn't been played / no API data.
// `reader` lets the same logic score any player's predictions:
// lg (default, own data) or getOtherPred (imported second player).
function findRealForGroupMatch(gid, mIdx, reader){
  const read = reader || lg;
  if(!realMatches || realMatches.length === 0) return null;
  const g = GD[gid];
  if(!g) return null;
  const [hi, ai] = g.m[mIdx];
  const hn = g.t[hi][1], an = g.t[ai][1];
  // Find the real match with both teams (in any order)
  for(const rm of realMatches){
    if(rm.group !== gid) continue;
    const rmH = ruName(rm.home) || rm.home;
    const rmA = ruName(rm.away) || rm.away;
    const direct = (rmH === hn && rmA === an) || (fuzzyMatch(hn, rmH) && fuzzyMatch(an, rmA));
    const swapped = (rmH === an && rmA === hn) || (fuzzyMatch(an, rmH) && fuzzyMatch(hn, rmA));
    if(!direct && !swapped) continue;
    // Match found — score it
    const mid = `g${gid}_${mIdx}`;
    const myH = read(mid+'_h'), myA = read(mid+'_a');
    if(myH === '' || myA === '') {
      // No prediction — still show real result with no scoring
      return {
        realH: direct ? rm.hs : rm.as,
        realA: direct ? rm.as : rm.hs,
        pts: null, kind: 'nopred'
      };
    }
    const myHome = +myH, myAway = +myA;
    const realH = direct ? rm.hs : rm.as;
    const realA = direct ? rm.as : rm.hs;
    if(myHome === realH && myAway === realA){
      return {realH, realA, pts: POINTS_EXACT, kind: 'full'};
    }
    const myOut = myHome === myAway ? 'D' : (myHome > myAway ? 'H' : 'A');
    const realOut = realH === realA ? 'D' : (realH > realA ? 'H' : 'A');
    if(myOut === realOut){
      const scoreDiff = Math.abs(myHome - realH) + Math.abs(myAway - realA);
      const kind = scoreDiff <= 1 ? 'near' : 'part';
      const pts = scoreDiff <= 1 ? POINTS_NEAR : POINTS_OUTCOME;
      return {realH, realA, pts, kind};
    }
    return {realH, realA, pts: 0, kind: 'zero'};
  }
  return null;
}

function isToday(iso){
  const d = new Date(iso);
  const now = new Date();
  return d.getUTCFullYear() === now.getUTCFullYear()
      && d.getUTCMonth() === now.getUTCMonth()
      && d.getUTCDate() === now.getUTCDate();
}

// Find the closest upcoming match strictly in the future. Returns the match
// object or null. Used by the "next match" timer in live header.
function nextUpcomingMatch(){
  const now = Date.now();
  for(const m of upcomingMatches){
    if(new Date(m.utc).getTime() > now) return m;
  }
  return null;
}

// Format "Xч Yм" or "Yм" depending on size. Used in next-match timer.
function fmtTimeUntil(ms){
  if(ms <= 0) return 'скоро';
  const totalMin = Math.floor(ms / 60000);
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  if(h >= 24){
    const d = Math.floor(h / 24);
    const rh = h % 24;
    return `${d}д ${rh}ч`;
  }
  if(h > 0) return `${h}ч ${m}м`;
  return `${m}м`;
}

// Update next-match timer DOM element. Called on tab open and on interval.
function updateNextMatchTimer(){
  const el = document.getElementById('next-match-timer');
  const lblEl = document.getElementById('next-match-label');
  if(!el) return; // tab not rendered, nothing to update

  const next = nextUpcomingMatch();
  if(!next){
    // Check if any matches at all today
    const hasMatchesToday = upcomingMatches.some(m => isToday(m.utc));
    el.textContent = hasMatchesToday ? 'идёт сейчас' : 'нет матчей';
    if(lblEl) lblEl.textContent = hasMatchesToday ? 'статус' : 'сегодня';
    el.classList.toggle('live-timer-quiet', !hasMatchesToday);
    return;
  }
  const ms = new Date(next.utc).getTime() - Date.now();
  el.textContent = fmtTimeUntil(ms);
  el.classList.remove('live-timer-quiet');
  if(lblEl) lblEl.textContent = 'до матча';
}

let nextMatchTimerInterval = null;
function startNextMatchTimer(){
  if(nextMatchTimerInterval) return; // already running
  updateNextMatchTimer();
  // Tick every minute. Recomputed minute-precision is enough for UX.
  nextMatchTimerInterval = setInterval(() => {
    // Only update if stats tab is currently visible — saves cycles otherwise
    const tab = document.getElementById('tab-stats');
    if(tab && tab.style.display !== 'none'){
      updateNextMatchTimer();
    } else {
      // No DOM target — stop timer to avoid leaking
      clearInterval(nextMatchTimerInterval);
      nextMatchTimerInterval = null;
    }
  }, 60000);
}

// Compute aggregate live stats: today's count + points, total points, max possible
function computeLiveScore(){
  let todayCount = 0, todayPts = 0;
  let totalPts = 0, totalMax = 0;
  const scoredMatches = []; // for the scroll row, only those with predictions
  const realUpsets = [];   // real-world upsets across the tournament
  const myUpsetSet = new Set();  // matches where user predicted an upset (group stage)

  realMatches.forEach(rm => {
    const sc = scoreRealMatch(rm);
    if(isToday(rm.utc)) todayCount++;
    if(sc){
      if(isToday(rm.utc)) todayPts += sc.pts;
      totalPts += sc.pts;
      totalMax += POINTS_EXACT;
      scoredMatches.push({...rm, ...sc});
    }
    // Detect real upset: non-favorite beat or drew with favorite
    if(rm.hs != null && rm.as != null){
      const hFav = FAVORITES.has(rm.home), aFav = FAVORITES.has(rm.away);
      let isUpset = false, winner, loser;
      if(rm.hs === rm.as && hFav !== aFav){
        isUpset = true; winner = hFav ? rm.away : rm.home; loser = hFav ? rm.home : rm.away;
      } else if(rm.hs > rm.as && aFav && !hFav){
        isUpset = true; winner = rm.home; loser = rm.away;
      } else if(rm.as > rm.hs && hFav && !aFav){
        isUpset = true; winner = rm.away; loser = rm.home;
      }
      if(isUpset){
        realUpsets.push({...rm, winner, loser, isDraw: rm.hs === rm.as});
      }
    }
  });

  // Find user's predicted upsets (group stage) to compare
  Object.entries(GD).forEach(([gid, g]) => {
    g.m.forEach(([hi, ai], i) => {
      const mid = `g${gid}_${i}`;
      const h = lg(mid+'_h'), a = lg(mid+'_a');
      if(h === '' || a === '') return;
      const hn = g.t[hi][1], an = g.t[ai][1];
      const hFav = FAVORITES.has(hn), aFav = FAVORITES.has(an);
      const hg = +h, ag = +a;
      let isUpset = false;
      if(hg === ag && hFav !== aFav) isUpset = true;
      else if(hg > ag && aFav && !hFav) isUpset = true;
      else if(ag > hg && hFav && !aFav) isUpset = true;
      if(isUpset) myUpsetSet.add(`${gid}:${hn}:${an}`);
    });
  });

  // How many of MY predicted upsets actually happened?
  let upsetsMatched = 0;
  realUpsets.forEach(ru => {
    if(!ru.group) return;
    const key1 = `${ru.group}:${ru.home}:${ru.away}`;
    const key2 = `${ru.group}:${ru.away}:${ru.home}`;
    if(myUpsetSet.has(key1) || myUpsetSet.has(key2)) upsetsMatched++;
  });

  // ── Real heroes & villains (only meaningful after group stage ends) ──
  // Heroes = non-favorites in top-2 of their real group
  // Villains = favorites NOT in top-2 of their real group
  const realHeroes = [], realVillains = [];
  const seenHero = new Set(), seenVillain = new Set();
  Object.entries(realData).forEach(([gid, rows]) => {
    // Skip stale keys longer than 1 char (e.g. "Group A" from old cache)
    if(gid.length > 1) return;
    if(!rows || rows.length < 2) return;
    rows.forEach((row, pos) => {
      const ruN = ruName(row.name);
      const isFav = FAVORITES.has(ruN);
      if(!isFav && pos < 2 && row.pl >= 1 && !seenHero.has(ruN)){
        seenHero.add(ruN);
        realHeroes.push({name: ruN, gid, pos: pos+1, pts: row.pts, diff: row.gf - row.ga});
      }
      if(isFav && pos > 1 && row.pl >= 2 && !seenVillain.has(ruN)){
        seenVillain.add(ruN);
        realVillains.push({name: ruN, gid, pos: pos+1, pts: row.pts, diff: row.gf - row.ga});
      }
    });
  });

  // Compare with user's heroes/villains (from group predictions)
  const myHeroNames = new Set();
  const myVillainNames = new Set();
  Object.entries(GD).forEach(([gid, g]) => {
    const rows = calcStd(gid, 'me');
    rows.forEach((r, pos) => {
      const name = g.t[r.i][1];
      if(!FAVORITES.has(name) && pos < 2 && r.pl >= 1) myHeroNames.add(name);
      if(FAVORITES.has(name) && pos > 1 && r.pl >= 2) myVillainNames.add(name);
    });
  });

  // ── Bracket survival: did user's playoff picks make it to real bracket? ──
  // Compare team NAMES in user's R32 slots vs real R32 (from realBracket if loaded)
  let bracketMatches = 0, bracketTotal = 0;
  const championName = bkGet('FIN', bkGet('FIN','t1s') > bkGet('FIN','t2s') ? 't1n' : 't2n');
  let championStillIn = null; // null = unknown, true = alive, false = out

  if(realMatches.some(m => m.stage && m.stage !== 'GROUP_STAGE')){
    // Some playoff matches exist
    const realPlayoffTeams = new Set();
    realMatches.forEach(m => {
      if(m.stage && m.stage !== 'GROUP_STAGE'){
        realPlayoffTeams.add(m.home);
        realPlayoffTeams.add(m.away);
      }
    });

    // Count user's R32 teams that show up in real playoff matches
    const myR32Teams = new Set();
    [...BK.LR32, ...BK.RR32].forEach(slot => {
      const t1n = bkGet(slot.id, 't1n');
      const t2n = bkGet(slot.id, 't2n');
      if(t1n) myR32Teams.add(t1n);
      if(t2n) myR32Teams.add(t2n);
    });
    bracketTotal = myR32Teams.size;
    myR32Teams.forEach(t => { if(realPlayoffTeams.has(t)) bracketMatches++; });

    // Champion alive check: is champion in any playoff match where they won, or yet to play?
    if(championName){
      // If champion lost any real playoff match → out
      let lost = false, played = false;
      realMatches.forEach(m => {
        if(!m.stage || m.stage === 'GROUP_STAGE') return;
        const wasInMatch = (m.home === championName || m.away === championName);
        if(!wasInMatch) return;
        played = true;
        const won = (m.home === championName && m.hs > m.as) ||
                    (m.away === championName && m.as > m.hs);
        if(!won) lost = true;
      });
      championStillIn = !lost;
    }
  }

  return {
    todayCount, todayPts, totalPts, totalMax, scoredMatches,
    totalMatches: realMatches.length,
    realUpsets, myUpsetCount: myUpsetSet.size, upsetsMatched,
    realHeroes, realVillains, myHeroNames, myVillainNames,
    bracketMatches, bracketTotal, championName, championStillIn
  };
}

function updateLiveBadge(){
  const el = document.getElementById('live-badge');
  const txt = document.getElementById('live-badge-text');
  if(!el || !txt) return;
  // Hide entirely until tournament starts producing matches
  if(realMatches.length === 0){
    el.style.display = 'none';
    return;
  }
  const live = computeLiveScore();
  if(live.todayCount === 0){
    el.style.display = 'none';
    return;
  }
  el.style.display = 'inline-flex';
  el.classList.toggle('zero', live.todayPts === 0);
  txt.textContent = live.todayPts > 0
    ? `+${live.todayPts} сегодня`
    : `${live.todayCount} ${live.todayCount===1?'матч':'матчей'} сегодня`;
}

// Compute friend's live points against real matches.
// Returns {todayPts, totalPts, totalMax} or null if no friend data.
function computeOtherLive(){
  if(!hasOther()) return null;
  let todayPts = 0, totalPts = 0, totalMax = 0;
  realMatches.forEach(rm => {
    if(!rm.group) return;
    const g = GD[rm.group];
    if(!g) return;
    for(let i = 0; i < g.m.length; i++){
      const [hi, ai] = g.m[i];
      const hn = g.t[hi][1], an = g.t[ai][1];
      const direct = (hn === rm.home && an === rm.away);
      const swapped = (hn === rm.away && an === rm.home);
      if(!direct && !swapped) continue;
      const mid = `g${rm.group}_${i}`;
      const oH = getOtherPred(mid+'_h'), oA = getOtherPred(mid+'_a');
      if(oH === '' || oA === '') return;
      const myHome = direct ? +oH : +oA;
      const myAway = direct ? +oA : +oH;
      let pts = 0;
      if(myHome === rm.hs && myAway === rm.as) pts = POINTS_EXACT;
      else {
        const myOut = myHome === myAway ? 'D' : (myHome > myAway ? 'H' : 'A');
        const realOut = rm.hs === rm.as ? 'D' : (rm.hs > rm.as ? 'H' : 'A');
        if(myOut === realOut) pts = POINTS_OUTCOME;
      }
      totalPts += pts;
      totalMax += POINTS_EXACT;
      if(isToday(rm.utc)) todayPts += pts;
      break;
    }
  });
  return {todayPts, totalPts, totalMax};
}

    const next = nextUpcomingMatch();
    let label = 'до матча', value = '—', quietClass = '';
    if(next){
      label = 'до матча';
      value = fmtTimeUntil(new Date(next.utc).getTime() - Date.now());
    } else if(upcomingMatches.some(m => isToday(m.utc))){
      label = 'статус';
      value = 'идёт сейчас';

      label = 'до старта';
      value = fmtTimeUntil(new Date(upcomingMatches[0].utc).getTime() - Date.now());

      label = 'сегодня';
      value = 'нет матчей';

    const myLead = live.totalPts - oLive.totalPts;
    const lblColor = myLead > 0 ? 'var(--gr)' : myLead < 0 ? 'var(--rd)' : 'var(--mu)';
    const lblText = myLead > 0

        : 'Идут вровень';

    // Real villains
    html += `<div class="hero-card villains">
      <div class="hero-card-title">💀 Реальные антигерои <span>— фавориты вне топ-2</span></div>`;

    } else {
      live.realVillains.slice(0,6).forEach(v => {
        const matched = live.myVillainNames.has(v.name);
        html += `<div class="hero-row">
          <span class="hero-name">${esc(v.name)}</span>
