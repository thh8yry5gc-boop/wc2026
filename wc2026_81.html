    live.realUpsets.slice(0, 8).forEach(u => {
      const scoreStr = u.isDraw ? `${u.hs}:${u.as} ничья` : `${u.hs}:${u.as}`;
      html += `<div class="live-match-card" style="border-color:rgba(244,208,63,0.4);background:rgba(244,208,63,0.05)">
        <div class="lm-teams">
          <div class="lm-team"><span class="name" style="color:var(--ac);font-weight:600">${esc(u.winner)}</span></div>
          <div class="lm-team"><span class="name" style="opacity:0.6">${esc(u.loser)}</span></div>
        </div>
        <div class="lm-scores" style="border-top-color:rgba(244,208,63,0.2)">
          <span style="color:var(--ac);font-family:'IBM Plex Mono',monospace">${scoreStr}</span>
          <span style="font-size:9px;color:var(--mu);text-transform:uppercase">${u.group ? 'гр. '+u.group : (u.stage||'').replace('_',' ').toLowerCase()}</span>
        </div>
      </div>`;
    });
    html += `</div></div>`;
  }

  // ── BLOCK 4: Bracket survival (only when playoff started) ──
  if(live.bracketTotal > 0){
    const champStatus = live.championStillIn === true ? 'Ещё в игре'
                       : live.championStillIn === false ? 'Выбыл'
                       : 'Ещё не играл';
    const champColor = live.championStillIn === true ? 'var(--gr)'
                     : live.championStillIn === false ? 'var(--rd)'
                     : 'var(--mu)';

    html += `<div class="live-section" style="margin-top:14px">
      <div class="live-header">
        <div class="live-title" style="color:var(--ac)">🎯 Твоя сетка vs реальность</div>
      </div>
      <div class="live-stats-row">
        <div class="live-stat">
          <div class="live-stat-num" style="color:var(--ac)">${live.bracketMatches}<span class="suffix"> / ${live.bracketTotal}</span></div>
          <div class="live-stat-label">Команд из твоего 1/32 прошли реально</div>
        </div>`;
    if(live.championName){
      html += `<div class="live-stat">
        <div class="live-stat-num" style="color:${champColor};font-size:24px;line-height:1.4">${live.championName}</div>
        <div class="live-stat-label">Твой чемпион · <span style="color:${champColor}">${champStatus}</span></div>
      </div>`;
    }
    html += `</div></div>`;
  }

  return html;
}

function renderBracket(){
  const mode=curBracketMode;
  const SH = BRACKET_SLOT_H[mode] || BRACKET_SLOT_H.me;
  const hasOther=!!localStorage.getItem('wc26_other_data');
  const stale = mode==='me' && isBracketStale();
  const modeBar=`<div class="bmode-bar">
    <button class="bmode-btn${mode==='me'?' on':''}" onclick="curBracketMode='me';renderBracket()">Мой прогноз</button>
    ${hasOther?`<button class="bmode-btn${mode==='compare'?' on':''}" onclick="curBracketMode='compare';renderBracket()">Сравнение</button>`:''}
    <button class="bmode-btn${mode==='real'?' on':''}" onclick="curBracketMode='real';renderBracket()">Реальные</button>
    ${stale?`<span class="stale-badge">⚠ группы изменились</span>`:''}
    ${mode==='me'?`<button class="btn btn-gold ${stale?'btn-pulse':''}" onclick="autoFillRoundOf32()" style="margin-left:auto">🔄 ${stale?'Пересчитать':'Автозаполнить'} 1/32</button><button class="btn btn-gold" onclick="autoAdvanceWinners()">⏭ Прокинуть</button>`:''}
    ${mode==='real'?`<button class="btn" onclick="fetchRealBracket()" style="margin-left:auto">↻ Обновить</button>`:''}
  </div>`;
  let h='<div class="bwrap">'+modeBar+'<div class="bracket">';
  h+='<div class="half left">';
  h+=bRound('1/32 · 28 июн–3 июл',BK.LR32,SH[0],undefined,mode);
  h+=connSVG(8,SH[0],'left');
  h+=bRound('1/16 · 4–7 июл',BK.L16,SH[1],undefined,mode);
  h+=connSVG(4,SH[1],'left');
  h+=bRound('Четвертьфинал · 9–11 июл',BK.LQF,SH[2],undefined,mode);
  h+=connSVG(2,SH[2],'left');
  h+=bRound('Полуфинал · 14–15 июл',BK.LSF,SH[3],undefined,mode);
  h+='</div>';

  // Position central column so the FINAL card vertically aligns with the
  // semi-final cards. SF column has 1 slot of height SH[3]; the SF card sits
  // centred in that slot, so its centre is at SH[3]/2 from top. The FINAL card
  // is ~120px tall, plus the round header (~30px) sits above all rounds.
  // So FINAL's top padding = SH[3]/2 - 60 + 30 = SH[3]/2 - 30.
  const centerPadTop = Math.max(0, Math.round(SH[3]/2 - 30));
  h+=`<div class="center-col" style="padding-top:${centerPadTop}px">
    <div class="center-col-final">
      ${mcCard(BK.FIN,true,false,mode)}
    </div>
    <div class="center-col-third">
      ${mcCard(BK.P3,false,true,mode)}
    </div>
  </div>`;

  h+='<div class="half right">';
  h+=bRound('1/32 · 28 июн–3 июл',BK.RR32,SH[0],undefined,mode);
  h+=connSVG(8,SH[0],'right');
  h+=bRound('1/16 · 4–7 июл',BK.R16,SH[1],undefined,mode);
  h+=connSVG(4,SH[1],'right');
  h+=bRound('Четвертьфинал · 9–11 июл',BK.RQF,SH[2],undefined,mode);
  h+=connSVG(2,SH[2],'right');
  h+=bRound('Полуфинал · 14–15 июл',BK.RSF,SH[3],undefined,mode);
  h+='</div>';

  h+='</div></div>';
  document.getElementById('tab-bracket').innerHTML=h;
}

   SCORE
   ═══════════════════════════════════════════════════════ */

/* ═══════════════════════════════════════════════════════
   STATS TAB — fill %, risk index, group stats, heroes/villains
   All metrics computed from user's actual predictions
   ═══════════════════════════════════════════════════════ */

const FAVORITES = new Set([
  'Аргентина','Бразилия','Франция','Англия','Германия',
  'Испания','Португалия','Нидерланды','Бельгия','Италия',
  'Хорватия','Уругвай'
]);

// Per-round weight for playoff upsets (used by both me and friend risk calc).
// Later rounds = harder to predict, more risk if the underdog wins.
const PLAYOFF_UPSET_WEIGHT = {
  'L32_': 3, 'R32_': 3,
  'L16_': 5, 'R16_': 5,
  'LQF': 7, 'RQF': 7,
  'LSF': 10, 'RSF': 10,
  'FIN': 12
};

// Resolve slot id (e.g. 'L32_4', 'LSF_1', 'FIN') to a key in PLAYOFF_UPSET_WEIGHT.
function getPlayoffRound(slotId){
  if(slotId === 'FIN') return 'FIN';
  if(slotId.startsWith('LSF') || slotId.startsWith('RSF')) return slotId.slice(0,3);
  if(slotId.startsWith('LQF') || slotId.startsWith('RQF')) return slotId.slice(0,3);
  return slotId.slice(0,4); // L16_ R16_ L32_ R32_
}

// All playoff slot IDs in evaluation order. Built from BK so adding rounds is automatic.
const PLAYOFF_SLOT_IDS = [
  ...BK.LR32.map(s => s.id),
  ...BK.RR32.map(s => s.id),
  'L16_1','L16_2','L16_3','L16_4','R16_1','R16_2','R16_3','R16_4',
  'LQF_1','LQF_2','RQF_1','RQF_2',
  'LSF_1','RSF_1','FIN'
];

// Compute risk/upsets for the imported friend's predictions.
// Mirror of the relevant parts of computeStats() but reads from getOtherPred/getOtherBk.
// Returns null if no friend data loaded.
function computeOtherStats(){
  if(!hasOther()) return null;
  let risk = 48, upsets = 0, fadedFavorites = 0, filled = 0, total = 0;

  // Group-stage scan
  Object.entries(GD).forEach(([gid, g]) => {
    g.m.forEach(([hi, ai], i) => {
      total++;
      const mid = `g${gid}_${i}`;
      const h = getOtherPred(mid+'_h'), a = getOtherPred(mid+'_a');
      if(h === '' || a === '') return;
      filled++;
      const hn = g.t[hi][1], an = g.t[ai][1];
      const hFav = FAVORITES.has(hn), aFav = FAVORITES.has(an);
      const hg = +h, ag = +a;
      if(hg === ag && hFav !== aFav) risk += 2;
      else if(hg > ag){
        if(aFav && !hFav){ risk += 4; upsets++; }
        else if(hFav && !aFav) risk -= 2;
      } else {
        if(hFav && !aFav){ risk += 4; upsets++; }
        else if(aFav && !hFav) risk -= 2;
      }
    });
  });

  // Faded favorites — using friend's predicted standings.
  // We compute them by mimicking calcStd but pulling other's scores.
  Object.entries(GD).forEach(([gid, g]) => {
    const st = g.t.map((_,i) => ({i,pts:0,w:0,d:0,l:0,gf:0,ga:0,pl:0}));
    g.m.forEach(([hi,ai], mi) => {
      const mid = `g${gid}_${mi}`;
      const h = getOtherPred(mid+'_h'), a = getOtherPred(mid+'_a');
      if(h === '' || a === '') return;
      const gh = +h, ga = +a;
      st[hi].pl++; st[ai].pl++;
      st[hi].gf += gh; st[hi].ga += ga;
      st[ai].gf += ga; st[ai].ga += gh;
      if(gh > ga){ st[hi].w++; st[hi].pts+=3; st[ai].l++; }
      else if(gh < ga){ st[ai].w++; st[ai].pts+=3; st[hi].l++; }
      else { st[hi].d++; st[ai].d++; st[hi].pts++; st[ai].pts++; }
    });
    st.sort((a,b) => b.pts-a.pts || (b.gf-b.ga)-(a.gf-a.ga) || b.gf-a.gf);
    st.forEach((row, pos) => {
      const name = g.t[row.i][1];
      if(FAVORITES.has(name) && pos > 1 && row.pl >= 1){
        risk += 9;
        fadedFavorites++;
      }
    });
  });

  // Playoff weighted upsets (uses module-level PLAYOFF_UPSET_WEIGHT and PLAYOFF_SLOT_IDS)
  PLAYOFF_SLOT_IDS.forEach(id => {
    const t1n = getOtherBk(id, 't1n');
    const t2n = getOtherBk(id, 't2n');
    if(!t1n || !t2n) return;
    const s1 = getOtherBk(id, 't1s'), s2 = getOtherBk(id, 't2s');
    if(s1 === '' || s2 === '') return;
    const a = +s1, b = +s2;
    let winner, loser;
    if(a === b){
      const pen = getOtherBk(id, 'pen');
      if(pen === '1'){ winner = t1n; loser = t2n; }
      else if(pen === '2'){ winner = t2n; loser = t1n; }
      else return;
    } else if(a > b){ winner = t1n; loser = t2n; }
    else { winner = t2n; loser = t1n; }
    if(!FAVORITES.has(winner) && FAVORITES.has(loser)){
      risk += PLAYOFF_UPSET_WEIGHT[getPlayoffRound(id)] || 5;
      upsets++;
    }
  });

  risk = Math.max(40, Math.min(94, Math.round(risk)));

  // ── Heroes / villains / per-group insights for the other player ──
  // We re-use calcStd with source='other' which already reads getOtherPred.
  const teamStats = {};
  const groupStats = {};
  Object.entries(GD).forEach(([gid, g]) => {
    let gFilled = 0, gUpsets = 0;
    g.m.forEach(([hi, ai], i) => {
      const mid = `g${gid}_${i}`;
      const h = getOtherPred(mid+'_h'), a = getOtherPred(mid+'_a');
      if(h === '' || a === '') return;
      gFilled++;
      const hn = g.t[hi][1], an = g.t[ai][1];
      const hFav = FAVORITES.has(hn), aFav = FAVORITES.has(an);
      const hg = +h, ag = +a;
      if(hg === ag && hFav !== aFav) gUpsets++;
      else if(hg > ag && aFav && !hFav) gUpsets++;
      else if(ag > hg && hFav && !aFav) gUpsets++;
    });
    const rows = calcStd(gid, 'other');
    rows.forEach((r, pos) => {
      const [flag, name] = g.t[r.i];
      teamStats[name] = {flag, name, gid, pos: pos+1, pts: r.pts, w: r.w, d: r.d, l: r.l, diff: r.gf - r.ga, gf: r.gf, ga: r.ga, pl: r.pl};
    });
    // Underdog leader detection
    let underdogLeader = null;
    if(rows.length > 0 && gFilled > 0){
      const leaderName = g.t[rows[0].i][1];
      const leaderFlag = g.t[rows[0].i][0];
      if(!FAVORITES.has(leaderName) && g.t.some(([_, n]) => FAVORITES.has(n))){
        let bestFavPos = null, bestFavName = null;
        rows.forEach((r, pos) => {
          const nm = g.t[r.i][1];
          if(FAVORITES.has(nm) && bestFavPos === null){
            bestFavPos = pos + 1;
            bestFavName = nm;
          }
        });
        underdogLeader = {name: leaderName, flag: leaderFlag, bestFavName, bestFavPos};
      }
    }
    groupStats[gid] = {
      filled: gFilled, total: g.m.length,
      percent: Math.round(gFilled/g.m.length*100),
      upsets: gUpsets,
      underdogLeader
    };
  });
  const heroes = [], villains = [], fadedFavoritesList = [];
  Object.values(teamStats).forEach(t => {
    if(t.pl < 1) return;
    if(!FAVORITES.has(t.name) && t.pts >= 6) heroes.push(t);
    if(FAVORITES.has(t.name) && t.pts < 3) villains.push(t);
    if(FAVORITES.has(t.name) && t.pos > 2 && t.pl >= 2) fadedFavoritesList.push(t);
  });
  heroes.sort((a,b) => b.pts - a.pts || b.diff - a.diff);
  villains.sort((a,b) => a.pts - b.pts || a.diff - b.diff);

  return {risk, upsets, fadedFavorites: fadedFavoritesList, filled, total, fillPercent: total ? Math.round(filled/total*100) : 0, heroes, villains, groupStats};
}

function computeStats(){
  let totalMatches = 0, filledMatches = 0;
  const groupStats = {};
  const teamStats = {};

  Object.entries(GD).forEach(([gid, g]) => {
    let filled = 0;
    g.m.forEach((_, i) => {
      totalMatches++;
      const mid = `g${gid}_${i}`;
      if(lg(mid+'_h') !== '' && lg(mid+'_a') !== ''){ filled++; filledMatches++; }
    });

    // Per-group upset count — how many times an underdog beat or drew with a favorite
    let groupUpsets = 0;
    g.m.forEach(([hi, ai], i) => {
      const mid = `g${gid}_${i}`;
      const h = lg(mid+'_h'), a = lg(mid+'_a');
      if(h === '' || a === '') return;
      const hn = g.t[hi][1], an = g.t[ai][1];
      const hFav = FAVORITES.has(hn), aFav = FAVORITES.has(an);
      const hg = +h, ag = +a;
      if(hg === ag && (hFav !== aFav)) groupUpsets++;
      else if(hg > ag && aFav && !hFav) groupUpsets++;
      else if(ag > hg && hFav && !aFav) groupUpsets++;
    });

    const rows = calcStd(gid, 'me');
    rows.forEach((r, pos) => {
      const [flag, name] = g.t[r.i];
      teamStats[name] = {flag, name, gid, pos: pos+1, pts: r.pts, w: r.w, d: r.d, l: r.l, diff: r.gf - r.ga, gf: r.gf, ga: r.ga, pl: r.pl};
    });

    // Underdog leader: top-1 in group is NOT a favorite, but some favorite IS in the group
    let underdogLeader = null;
    if(rows.length > 0 && filled > 0){
      const leaderName = g.t[rows[0].i][1];
      const leaderFlag = g.t[rows[0].i][0];
      const isLeaderUnderdog = !FAVORITES.has(leaderName);
      const hasFav = g.t.some(([_, n]) => FAVORITES.has(n));
      if(isLeaderUnderdog && hasFav){
        // Find best favorite in this group to describe the gap
        let bestFavPos = null, bestFavName = null;
        rows.forEach((r, pos) => {
          const nm = g.t[r.i][1];
          if(FAVORITES.has(nm) && bestFavPos === null){
            bestFavPos = pos + 1;
            bestFavName = nm;
          }
        });
        underdogLeader = {name: leaderName, flag: leaderFlag, bestFavName, bestFavPos};
      }
    }

    groupStats[gid] = {
      filled, total: g.m.length,
      percent: Math.round(filled/g.m.length*100),
      upsets: groupUpsets,
      underdogLeader
    };
  });

  // Risk index: base 45, +5 fav→loss, +3 fav-underdog draw, -1 fav win, +8 fav doesn't advance
  let risk = 48, upsets = 0;
  const fadedFavorites = [];

  Object.entries(GD).forEach(([gid, g]) => {
    g.m.forEach(([hi, ai], i) => {
      const mid = `g${gid}_${i}`;
      const h = lg(mid+'_h'), a = lg(mid+'_a');
      if(h === '' || a === '') return;
      const hn = g.t[hi][1], an = g.t[ai][1];
      const hFav = FAVORITES.has(hn), aFav = FAVORITES.has(an);
      const hg = +h, ag = +a;
      if(hg === ag && (hFav !== aFav)){
        risk += 2;
      } else if(hg > ag){
        if(aFav && !hFav){ risk += 4; upsets++; }
        else if(hFav && !aFav){ risk -= 2; }
      } else {
        if(hFav && !aFav){ risk += 4; upsets++; }
        else if(aFav && !hFav){ risk -= 2; }
      }
    });
  });

  Object.values(teamStats).forEach(t => {
    if(FAVORITES.has(t.name) && t.pos > 2 && t.pl >= 1){
      risk += 9;
      fadedFavorites.push(t);
    }
  });

  // ── Playoff risk: upsets in knockout stage, weighted by round ──
  // Uses module-level PLAYOFF_UPSET_WEIGHT + getPlayoffRound + PLAYOFF_SLOT_IDS.
  let playoffUpsets = 0;
  PLAYOFF_SLOT_IDS.forEach(slotId => {
    const t1n = bkGet(slotId, 't1n');
    const t2n = bkGet(slotId, 't2n');
    if(!t1n || !t2n || t1n === 'TBD' || t2n === 'TBD') return;
    const s1 = bkGet(slotId, 't1s');
    const s2 = bkGet(slotId, 't2s');
    if(s1 === '' || s2 === '') return;
    const a = +s1, b = +s2;

    // Determine winner. On tie, look up penalty-pick flag.
    let winner, loser;
    if(a === b){
      const pen = bkGet(slotId, 'pen');
      if(pen === '1'){ winner = t1n; loser = t2n; }
      else if(pen === '2'){ winner = t2n; loser = t1n; }
      else return; // undecided tie — skip
    } else if(a > b){
      winner = t1n; loser = t2n;
    } else {
      winner = t2n; loser = t1n;
    }

    // Real upset: non-favorite beats favorite in knockout
    if(!FAVORITES.has(winner) && FAVORITES.has(loser)){
      risk += PLAYOFF_UPSET_WEIGHT[getPlayoffRound(slotId)] || 5;
      playoffUpsets++;
    }
  });

  upsets += playoffUpsets;
  risk = Math.max(40, Math.min(94, Math.round(risk)));

  const heroes = [], villains = [];
  Object.values(teamStats).forEach(t => {
    if(t.pl < 1) return;
    if(!FAVORITES.has(t.name) && t.pts >= 6) heroes.push(t);
    if(FAVORITES.has(t.name) && t.pts < 3) villains.push(t);
  });
  heroes.sort((a,b) => b.pts - a.pts || b.diff - a.diff);
  villains.sort((a,b) => a.pts - b.pts || a.diff - b.diff);

  return {
    totalMatches, filledMatches,
    fillPercent: totalMatches ? Math.round(filledMatches/totalMatches*100) : 0,
    groupStats,
    risk, upsets, fadedFavorites,
    heroes: heroes.slice(0, 6),
    villains: villains.slice(0, 6)
  };
}

function riskLevel(r){
  if(r < 55) return {label:'Консервативный', cls:'risk-conservative', desc:'Ты ставишь на топ-сборных и редко веришь в сенсации'};
  if(r < 70) return {label:'Сбалансированный', cls:'risk-balanced', desc:'Микс из надёжных прогнозов и пары смелых ставок'};
  if(r < 80) return {label:'Смелый', cls:'risk-bold', desc:'Ставишь на андердогов и любишь сенсации'};
  return {label:'Очень дерзкий', cls:'risk-daring', desc:'Букмекеры от твоих прогнозов плачут — половина фаворитов летит мимо'};
}

function renderStats(){
  const s = computeStats();
  const lvl = riskLevel(s.risk);
  const riskColor = s.risk < 55 ? 'var(--mu)' : s.risk < 70 ? 'var(--ac2)' : s.risk < 80 ? 'var(--ac)' : 'var(--rd)';
  // Scale 40..94 → 0..100%
  const markerPct = Math.max(0, Math.min(100, (s.risk - 40) / 54 * 100));

  // Auto-refresh live data on tab open if stale (>5 min). Silent — no toast.
  // Worker mode needs no stored key; fallback mode requires one.
  if(Date.now() - liveAutoRefreshAt > LIVE_AUTO_REFRESH_MS && (USE_WORKER || localStorage.getItem('wc26_apikey'))){
    fetchRealMatches(true).then(() => {
      // Re-render if we got fresh data so live section updates
      if(document.getElementById('tab-stats').style.display !== 'none') renderStats();
    });
  }

  // Live tracker block goes first — it's the most time-sensitive info
  let html = renderLiveSection();

  // After HTML is in the DOM (next tick), start the per-minute timer.
  // The timer auto-stops when the tab is no longer visible.
  setTimeout(startNextMatchTimer, 0);

  // ── Duel block: side-by-side comparison with friend's predictions ──
  // Only shown if a friend's JSON has been imported.
  const oStats = computeOtherStats();
  if(oStats){
    const oLvl = riskLevel(oStats.risk);
    const oRiskColor = oStats.risk < 55 ? 'var(--mu)' : oStats.risk < 70 ? 'var(--ac2)' : oStats.risk < 80 ? 'var(--ac)' : 'var(--rd)';
    const meBolder = s.risk > oStats.risk;
    const tie = s.risk === oStats.risk;

    html += `<div class="section-title">⚔ Дуэль прогнозов</div>
    <div class="duel-grid">
      <div class="duel-card ${meBolder ? 'duel-winner' : ''}">
        <div class="duel-name">Ты</div>
        <div class="duel-risk" style="color:${riskColor}">${s.risk}</div>
        <div class="duel-tag"><span class="risk-style-tag ${lvl.cls}">${lvl.label}</span></div>
        <div class="duel-row"><span>Сенсаций:</span><b style="color:var(--ac)">${s.upsets}</b></div>
        <div class="duel-row"><span>Фаворитов мимо:</span><b style="color:var(--rd)">${s.fadedFavorites.length}</b></div>
        <div class="duel-row"><span>Заполнено:</span><b>${s.fillPercent}%</b></div>
      </div>
      <div class="duel-vs">${tie ? '=' : 'vs'}</div>
      <div class="duel-card ${!meBolder && !tie ? 'duel-winner' : ''}">
        <div class="duel-name">Второй игрок</div>
        <div class="duel-risk" style="color:${oRiskColor}">${oStats.risk}</div>
        <div class="duel-tag"><span class="risk-style-tag ${oLvl.cls}">${oLvl.label}</span></div>
        <div class="duel-row"><span>Сенсаций:</span><b style="color:var(--ac)">${oStats.upsets}</b></div>
        <div class="duel-row"><span>Фаворитов мимо:</span><b style="color:var(--rd)">${oStats.fadedFavorites.length}</b></div>
        <div class="duel-row"><span>Заполнено:</span><b>${oStats.fillPercent}%</b></div>
      </div>
    </div>`;

    // Build a descriptive verdict that explains *how* risk profiles differ
    const riskDiff = Math.abs(s.risk - oStats.risk);
    let verdict;
    if(tie){
      verdict = `Оба одинаково дерзкие · по ${s.upsets} ${s.upsets===1?'сенсации':'сенсаций'} в прогнозах`;
    } else {
      const leader = meBolder ? 'Ты' : 'Второй игрок';
      const follower = meBolder ? 'второй' : 'ты';
      const lUpsets = meBolder ? s.upsets : oStats.upsets;
      const fUpsets = meBolder ? oStats.upsets : s.upsets;
      const lFaded = meBolder ? s.fadedFavorites.length : oStats.fadedFavorites.length;
      const fFaded = meBolder ? oStats.fadedFavorites.length : s.fadedFavorites.length;
      let detail;
      if(lUpsets >= fUpsets + 3){
        detail = ` — закладываешь ${lUpsets} сенсаций против ${fUpsets} у ${meBolder ? 'второго' : 'тебя'}, ${follower} играет осторожнее.`;
      } else if(lFaded >= fFaded + 2){
        detail = ` — отправляешь ${lFaded} фаворитов мимо плейофф, ${follower} верит в классику.`;
      } else if(riskDiff >= 15){
        detail = ' — заметная разница в подходе.';
      } else {
        detail = ' — но в целом стили похожи.';
      }
      verdict = `${leader} на ${riskDiff} ${riskDiff===1?'пункт':riskDiff<5?'пункта':'пунктов'} рискованнее${detail}`;

    html += `<div class="duel-verdict">${verdict}</div>`;

  html += `<div class="section-title">📊 Общая статистика</div>

  // Only show fill card when there's something to fill — hide at 100% to avoid clutter
  if(s.fillPercent < 100){

        <div class="progress-bar"><div class="progress-fill" style="width:${s.fillPercent}%"></div></div>
        <div class="stat-card-sub" style="color:var(--gr);font-weight:700">${s.fillPercent}% готово</div>
      </div>`;
  }

  html += `
      <div class="stat-card stat-card-feature">

          Сенсаций: <span style="color:var(--ac);font-weight:700">${s.upsets}</span>${s.fadedFavorites.length?` · фаворитов мимо: <span style="color:var(--rd);font-weight:700">${s.fadedFavorites.length}</span>`:''}
        </div>
        <div class="stat-card-sub" style="margin-top:8px;font-size:11px;color:var(--mu);opacity:0.7">Средний прогнозист ~58</div>
      </div>
    </div>

    <div class="section-title">По группам</div>`;

  // If a second player's data is loaded, allow viewing the section below
  // ("По группам" + "Герои/Антигерои") from either player's perspective.
  // The Duel block above already shows both sides, this toggle is for detail browsing.
  if(oStats){
    const otherName = getOtherName();
    html += `<div class="stats-src-bar">
      <span class="stats-src-label">Чьи данные:</span>
      <button class="tz-btn${curStatsSrc==='me'?' on':''}" onclick="setStatsSrc('me')">Ты</button>
      <button class="tz-btn${curStatsSrc==='other'?' on':''}" onclick="setStatsSrc('other')">2-й игрок</button>
      <span class="stats-src-hint">${curStatsSrc === 'other' ? `Показаны данные второго игрока (${otherName})` : 'Показаны твои данные'}</span>
    </div>`;
  }
  // Pick the source for "По группам" + heroes/villains below
  const src = (curStatsSrc === 'other' && oStats) ? oStats : s;

  // ── Group insights: filled count, boldest group, biggest surprise ──
  const groupsFilledFully = Object.values(src.groupStats).filter(g => g.percent >= 100).length;
  const totalGroups = Object.keys(src.groupStats).length;

  // Boldest = group with the most upsets (favorite lost or drew to underdog)
  let boldest = null;
  Object.entries(src.groupStats).forEach(([gid, st]) => {
    if(st.upsets > 0 && (!boldest || st.upsets > boldest.upsets)){
      boldest = {gid, upsets: st.upsets};
    }
  });

  // Surprise = group where underdog leads, biggest gap to best favorite
  let surprise = null;
  Object.entries(src.groupStats).forEach(([gid, st]) => {
    if(!st.underdogLeader) return;
    const gap = st.underdogLeader.bestFavPos != null ? st.underdogLeader.bestFavPos - 1 : 0;
    if(!surprise || gap > surprise.gap){
      surprise = {gid, ...st.underdogLeader, gap};
    }
  });

  html += `<div class="group-insights-grid">`;

  if(boldest){
    html += `<div class="stat-card" style="border-color:rgba(244,208,63,0.4);box-shadow:0 0 18px rgba(244,208,63,0.12)">
      <div class="stat-card-label">🔥 Самая дерзкая</div>
      <div style="font-size:32px;font-weight:700;font-family:'Bebas Neue',sans-serif;letter-spacing:.04em">Группа ${boldest.gid}</div>
      <div class="stat-card-sub" style="color:var(--ac)">${boldest.upsets} ${boldest.upsets === 1 ? 'сенсация' : boldest.upsets < 5 ? 'сенсации' : 'сенсаций'} в матчах</div>
    </div>`;
  }

  if(surprise){
    html += `<div class="stat-card" style="border-color:rgba(103,232,249,0.4);box-shadow:0 0 18px rgba(103,232,249,0.12)">
      <div class="stat-card-label">🎲 Самая неожиданная</div>
      <div style="font-size:32px;font-weight:700;font-family:'Bebas Neue',sans-serif;letter-spacing:.04em">Группа ${surprise.gid}</div>
      <div class="stat-card-sub" style="color:var(--ac2)">${surprise.flag} ${esc(surprise.name)} лидирует${surprise.bestFavName ? ` — ${esc(surprise.bestFavName)} только ${surprise.bestFavPos}-й` : ''}</div>
    </div>`;
  }

  html += `</div>`;

  // ── Compact grid of all 12 groups ──
  // Always render in alphabetical order (A→L) — easier to scan than by %
  html += `<div class="group-compact-grid">`;
  GKEYS.forEach(gid => {
    const stat = src.groupStats[gid];
    const color = stat.percent >= 100 ? 'var(--gr)' : stat.percent >= 50 ? 'var(--ac)' : stat.percent > 0 ? 'var(--ac2)' : 'var(--mu)';
    const isBoldest = boldest && boldest.gid === gid;
    const isSurprise = surprise && surprise.gid === gid;
    const extra = isBoldest ? ' boldest' : isSurprise ? ' surprise' : '';
    const marker = isBoldest ? '<div class="group-compact-marker">🔥</div>' : isSurprise ? '<div class="group-compact-marker">🎲</div>' : '';
    html += `<div class="group-compact${extra}">
      ${marker}
      <div class="group-compact-letter">${gid}</div>
      <div class="group-compact-pct" style="color:${color}">${stat.percent}%</div>
    </div>`;
  });
  html += `</div>`;

  html += `<div class="section-title">⚔ Герои и Антигерои</div>
    <div class="heroes-grid">
      <div class="hero-card heroes">
        <div class="hero-card-title">⭐ Герои <span>— нефавориты с ≥6 очков</span></div>`;
  if(src.heroes.length === 0){
    html += `<div class="stats-empty" style="margin:0;padding:18px">Пока никого. Заполни группы — появятся андердоги, которых ты вытащил наверх.</div>`;
  } else {
    src.heroes.forEach(h => {
      html += `<div class="hero-row">
        <span class="hero-flag">${h.flag}</span>
        <span class="hero-name">${esc(h.name)}</span>
        <span class="hero-stats">${h.pts}о · РМ ${h.diff>=0?'+':''}${h.diff} · гр.${h.gid}</span>
      </div>`;
    });
  }
  html += `</div>
      <div class="hero-card villains">
        <div class="hero-card-title">💀 Антигерои <span>— фавориты с &lt;3 очков</span></div>`;
  if(src.villains.length === 0){
    html += `<div class="stats-empty" style="margin:0;padding:18px">Все фавориты на местах — никакой драмы. Скучновато 😏</div>`;
  } else {
    src.villains.forEach(v => {
      html += `<div class="hero-row">
        <span class="hero-flag">${v.flag}</span>
        <span class="hero-name">${esc(v.name)}</span>
        <span class="hero-stats">${v.pts}о · РМ ${v.diff>=0?'+':''}${v.diff} · гр.${v.gid}</span>
      </div>`;
    });
  }
  html += `</div></div>`;

  document.getElementById('tab-stats').innerHTML = html;
  parseEmoji(document.getElementById('tab-stats'));
}

function renderScore(){
  const filled=Object.keys(GD).reduce((n,gid)=>n+GD[gid].m.filter((_,i)=>lg(`g${gid}_${i}_h`)!==''&&lg(`g${gid}_${i}_a`)!=='').length,0);
  let h=`<div class="rules-box">Система: <span>${POINTS_EXACT} очков</span> — точный счёт &nbsp;·&nbsp; <span>${POINTS_NEAR} очка</span> — победитель + счёт ±1 гол &nbsp;·&nbsp; <span>${POINTS_OUTCOME} очко</span> — верный исход &nbsp;·&nbsp; <span>0</span> — промах<br>Заполнено матчей: <span>${filled}</span> из ${TOTAL_GROUP_MATCHES} (групповой этап)</div>`;

  const hasOtherData = hasOther();
  const hasReal = realMatches && realMatches.length > 0;

  // ════ MAIN SCORE: each player vs REAL results ════
  // This is the actual competition: points for guessing reality, not each other.
  let myReal = 0, thReal = 0, playedCount = 0;
  const realGroupBlocks = [];
  if(hasReal){
    Object.entries(GD).forEach(([gid, g]) => {
      const rows = [];
      let gMy = 0, gTh = 0;
      g.m.forEach((m, i) => {
        const mine = findRealForGroupMatch(gid, i);            // my prediction vs real
        if(!mine) return;                                       // match not played yet
        playedCount++;
        const theirs = hasOtherData ? findRealForGroupMatch(gid, i, getOtherPred) : null;
        const myPts = mine.pts ?? 0;
        const thPts2 = theirs ? (theirs.pts ?? 0) : null;
        myReal += myPts;
        if(thPts2 !== null) thReal += thPts2;
        gMy += myPts;
        if(thPts2 !== null) gTh += thPts2;
        const [fh, nh] = g.t[m[0]], [fa, na] = g.t[m[1]];
        const mid = `g${gid}_${i}`;
        const myH = lg(mid+'_h'), myA = lg(mid+'_a');
        const tag = k => k==='full'?'⚡':k==='near'?'★':k==='part'?'✓':k==='zero'?'✗':'·';
        const cls = k => k==='full'?'exact':k==='near'?'near':k==='part'?'outcome':'miss';
        rows.push(`<div class="sc-row sc-${cls(mine.kind)}">
          <span class="sc-tag">${tag(mine.kind)}</span>
          <span class="sc-teams">${fh} ${nh} <b class="sc-real-score">${mine.realH}:${mine.realA}</b> ${na} ${fa}</span>
          <span class="sc-scores">
            <span class="sc-pred-block" title="твой прогноз">
              <span class="sc-pred-label">ты</span>
              <b>${myH!==''?myH+':'+myA:'–'}</b>
            </span>
            ${theirs && theirs.kind!=='nopred' ? `<span class="sc-pred-sep">·</span><span class="sc-pred-block" title="прогноз второго игрока"><span class="sc-pred-label sc-pred-other">2-й</span><b class="sc-other">${tag(theirs.kind)}</b></span>` : ''}
          </span>
        </div>`);
      });
      if(rows.length === 0) return;
      realGroupBlocks.push(`<div class="sc-group">
        <div class="sc-group-head">
          <span class="sc-group-id">Группа ${gid}</span>
          <span class="sc-group-stats">ты +${gMy}${hasOtherData ? ` · 2-й +${gTh}` : ''}</span>
        </div>
        ${rows.join('')}
      </div>`);
    });
  }

  // Big score cards — REAL points
  const lead = myReal - thReal;
  // ── Build per-day accumulated points for the chart ──
  // realMatches is sorted newest-first; reverse for chronological order
  const chronoMatches = [...realMatches].reverse();
  // Get sorted unique match days (UTC date string "YYYY-MM-DD")
  const daySet = new Set(chronoMatches.map(m => m.utc?.slice(0,10)).filter(Boolean));
  const days = [...daySet].sort();

  // Accumulate points per day for each player
  let myAcc = 0, thAcc = 0;
  const chartData = []; // [{day, label, me, them}]
  days.forEach(day => {
    const dayMatches = chronoMatches.filter(m => m.utc?.slice(0,10) === day);
    dayMatches.forEach(rm => {
      // Find corresponding group match index to get predictions
      for(const [gid, g] of Object.entries(GD)){
        g.m.forEach((mm, i) => {
          const [hi, ai] = mm;
          const hn = g.t[hi][1], an = g.t[ai][1];
          if((rm.home === hn && rm.away === an) || (rm.home === an && rm.away === hn)){
            const mid = `g${gid}_${i}`;
            const myH = lg(mid+'_h'), myA = lg(mid+'_a');
            const thH = getOtherPred(mid+'_h'), thA = getOtherPred(mid+'_a');
            const direct = rm.home === hn;
            const rH = direct ? rm.hs : rm.as, rA = direct ? rm.as : rm.hs;
            if(myH !== '' && myA !== ''){
              if(+myH===rH && +myA===rA) myAcc += POINTS_EXACT;
              else { const mo=+myH>+myA?'H':+myH<+myA?'A':'D', ro=rH>rA?'H':rH<rA?'A':'D'; if(mo===ro) myAcc += POINTS_OUTCOME; }
            }
            if(thH !== '' && thA !== ''){
              if(+thH===rH && +thA===rA) thAcc += POINTS_EXACT;
              else { const to=+thH>+thA?'H':+thH<+thA?'A':'D', ro=rH>rA?'H':rH<rA?'A':'D'; if(to===ro) thAcc += POINTS_OUTCOME; }
            }
          }
        });
      }
    });
    // Short label: "11 июн" → "11/6"
    const d = new Date(day+'T12:00:00Z');
    const label = `${d.getUTCDate()}/${d.getUTCMonth()+1}`;
    chartData.push({day, label, me: myAcc, them: thAcc});
  });

  // Build SVG chart
  function buildChart(data, hasOther){
    if(data.length === 0) return `<div class="sc-chart-empty">График появится после первых матчей</div>`;
    const W = 340, H = 200, PAD = {t:20, r:16, b:32, l:36};
    const cW = W - PAD.l - PAD.r, cH = H - PAD.t - PAD.b;
    const maxPts = Math.max(...data.map(d => Math.max(d.me, d.them||0)), 3);
    const xStep = data.length > 1 ? cW / (data.length - 1) : cW;
    const yScale = v => cH - (v / maxPts * cH);
    const pts = (key) => data.map((d,i) => `${PAD.l + i * xStep},${PAD.t + yScale(d[key])}`).join(' ');

    // Y axis labels
    const yTicks = [0, Math.round(maxPts/2), maxPts];
    const yLines = yTicks.map(v => {
      const y = PAD.t + yScale(v);
      return `<line x1="${PAD.l}" y1="${y}" x2="${W-PAD.r}" y2="${y}" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
              <text x="${PAD.l-4}" y="${y+4}" text-anchor="end" fill="#888" font-size="9" font-family="IBM Plex Mono">${v}</text>`;
    }).join('');

    // X axis labels
    const xLabels = data.map((d,i) => {
      const x = PAD.l + i * xStep;
      return `<text x="${x}" y="${H-4}" text-anchor="middle" fill="#888" font-size="9" font-family="IBM Plex Mono">${d.label}</text>`;
    }).join('');

    // Dots
    const myDots = data.map((d,i) => `<circle cx="${PAD.l + i*xStep}" cy="${PAD.t + yScale(d.me)}" r="3" fill="#f4d03f"/>`).join('');
    const thDots = hasOther ? data.map((d,i) => `<circle cx="${PAD.l + i*xStep}" cy="${PAD.t + yScale(d.them)}" r="3" fill="#67e8f9"/>`).join('') : '';

    // Last point labels
    const lastMe = data[data.length-1];
    const meX = PAD.l + (data.length-1)*xStep, meY = PAD.t + yScale(lastMe.me);
    const thX = meX, thY = PAD.t + yScale(lastMe.them||0);

    return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto">
      ${yLines}
      ${xLabels}
      ${hasOther ? `<polyline points="${pts('them')}" fill="none" stroke="#67e8f9" stroke-width="2" stroke-linejoin="round"/>` : ''}
      <polyline points="${pts('me')}" fill="none" stroke="#f4d03f" stroke-width="2.5" stroke-linejoin="round"/>
      ${thDots}
      ${myDots}
      <text x="${meX+5}" y="${meY+4}" fill="#f4d03f" font-size="10" font-weight="bold" font-family="IBM Plex Mono">${lastMe.me}</text>
      ${hasOther ? `<text x="${thX+5}" y="${thY+4}" fill="#67e8f9" font-size="10" font-weight="bold" font-family="IBM Plex Mono">${lastMe.them}</text>` : ''}
    </svg>`;
  }

  const chartSVG = buildChart(chartData, hasOtherData);

  h+=`<div class="sc-main-label">Очки за реальные результаты</div>
  <div class="score-cards">
    <div class="score-card me${lead>0?' sc-leading':''}"><div class="slbl">Ты</div><div class="snum me">${myReal}</div><div style="font-size:11px;color:var(--mu)">очков</div></div>
    <div class="score-card${lead<0?' sc-leading':''}"><div class="slbl">Второй игрок</div><div class="snum them">${hasOtherData ? thReal : '—'}</div><div style="font-size:11px;color:var(--mu)">${hasOtherData?'очков':'нет данных'}</div></div>
  </div>`;

  if(!hasReal){
    h+=`<div class="sc-waiting">⏳ Турнир ещё не начался — очки появятся после первых сыгранных матчей.<br><span style="opacity:0.7">Обнови реальные результаты на вкладке «Таблица» после 11 июня.</span></div>`;
  } else if(hasOtherData){
    h+=`<div class="sc-lead-line">${lead === 0 ? 'Пока ничья' : lead > 0 ? `Ты впереди на +${lead}` : `Второй игрок впереди на +${-lead}`} · сыграно: ${playedCount} из ${TOTAL_GROUP_MATCHES}</div>`;
  }

  // Two-column layout: match cards left, chart right
  if(realGroupBlocks.length > 0 || chartData.length > 0){
    h+=`<div class="sc-two-col">
      <div class="sc-col-groups">${realGroupBlocks.join('')}</div>
      <div class="sc-col-chart">
        <div class="sc-chart-box">
          <div class="sc-chart-title">
            <span style="color:var(--ac)">— ты</span>
            ${hasOtherData ? `<span style="color:var(--ac2);margin-left:12px">— второй игрок</span>` : ''}
          </div>
          ${chartSVG}
        </div>
      </div>
    </div>`;
  }

  // ════ SECONDARY: prediction agreement (curiosity, not competition) ════
  if(hasOtherData){
    let agreeExact=0, agreeOutcome=0, agreeMiss=0;
    Object.entries(GD).forEach(([gid,g])=>{
      g.m.forEach((m,i)=>{
        const mid=`g${gid}_${i}`;
        const mh=lg(mid+'_h'), ma=lg(mid+'_a');
        const th=getOtherPred(mid+'_h'), ta=getOtherPred(mid+'_a');
        if(mh===''||ma===''||th===''||ta==='') return;
        const mhi=+mh, mai=+ma, thi=+th, tai=+ta;
        const mo=mhi>mai?1:mhi<mai?-1:0, to=thi>tai?1:thi<tai?-1:0;
        if(mhi===thi && mai===tai) agreeExact++;
        else if(mo===to) agreeOutcome++;
        else agreeMiss++;
      });
    });
    const agreeTotal = agreeExact + agreeOutcome + agreeMiss;
    if(agreeTotal > 0){
      const agreePct = Math.round((agreeExact + agreeOutcome) / agreeTotal * 100);
      h+=`<div class="sc-agree-box">
        <div class="sc-agree-title">Насколько совпали ваши прогнозы</div>
        <div class="sc-summary" style="margin:0">
          <span class="sc-summary-item sc-exact-c"><b>${agreeExact}</b> точь-в-точь <small>(⚡)</small></span>
          <span class="sc-summary-item sc-outcome-c"><b>${agreeOutcome}</b> одинаковый исход <small>(✓)</small></span>
          <span class="sc-summary-item sc-miss-c"><b>${agreeMiss}</b> разошлись <small>(✗)</small></span>
          <span class="sc-summary-item"><b>${agreePct}%</b> согласия</span>
        </div>
      </div>`;
    }
  } else {
    h+=`<div class="no-data">Экспортируй свой JSON → отправь второму игроку → он импортирует → здесь появится сравнение</div>`;
  }

  document.getElementById('tab-score').innerHTML=h;
  parseEmoji(document.getElementById('tab-score'));
}


/* ═══════════════════════════════════════════════════════
   CHAMPION — path tracing through bracket

function getStageMatch(stageId){
  const t1n = bkGet(stageId,'t1n') || '—';
  const t2n = bkGet(stageId,'t2n') || '—';
  const t1f = bkGet(stageId,'t1f') || '';
  const t2f = bkGet(stageId,'t2f') || '';
  const t1s = bkGet(stageId,'t1s');
  const t2s = bkGet(stageId,'t2s');
  const hasScore = t1s !== '' && t2s !== '';
  const winner = hasScore ? (+t1s > +t2s ? t1n : +t1s < +t2s ? t2n : null) : null;
  return {t1n,t2n,t1f,t2f,t1s,t2s,hasScore,winner};
}

// Find the match in a given round where champion (by name) participates
function findChampMatch(roundIds, champName){
  if(!champName || champName === '—') return null;
  const lc = champName.toLowerCase();
  for(const id of roundIds){
    const m = getStageMatch(id);
    if(m.t1n === '—' && m.t2n === '—') continue;
    if(fuzzyMatch(m.t1n, champName) || fuzzyMatch(m.t2n, champName)){
      return {...m, slotId:id};
    }
  }
  return null;
}

      champion = outcome.winner.name;
      championFlag = outcome.winner.flag;
      runnerUp = outcome.loser.name;
      runnerUpFlag = outcome.loser.flag;

  let html = `

      ${(() => {

        // Compute friend's champion from their FIN slot
        const oT1n = getOtherBk('FIN','t1n');
        const oT2n = getOtherBk('FIN','t2n');
        const oT1f = getOtherBk('FIN','t1f');
        const oT2f = getOtherBk('FIN','t2f');
        const oT1s = getOtherBk('FIN','t1s');
        const oT2s = getOtherBk('FIN','t2s');
        const oPen = getOtherBk('FIN','pen');
        let oName = '—', oFlag = '';

        const same = oName === champion;
        return `<div class="champion-rival ${same ? 'champion-rival-match' : ''}">
          <span class="champion-rival-label">Чемпион второго игрока:</span>
          <span class="champion-rival-team">${oFlag} ${oName}</span>
          ${same ? '<span class="champion-rival-badge">✓ совпадает</span>' : '<span class="champion-rival-badge diff">≠ другой</span>'}
        </div>`;
      })()}
      
      <div class="path">
        <div class="${stageClass(r32)}">
          <div class="stage-label">1/32 финала</div>
          <div class="stage-match">${renderStageMatch(r32)}</div>
        </div>
        <div class="${stageClass(r16)}">
          <div class="stage-label">1/16 финала</div>
          <div class="stage-match">${renderStageMatch(r16)}</div>
        </div>
        <div class="${stageClass(qf)}">
          <div class="stage-label">Четвертьфинал</div>
          <div class="stage-match">${renderStageMatch(qf)}</div>
        </div>
        <div class="${stageClass(sf)}">
          <div class="stage-label">Полуфинал</div>
          <div class="stage-match">${renderStageMatch(sf)}</div>
        </div>
        <div class="stage final">
          <div class="stage-label">Финал</div>
          <div class="stage-match">${renderStageMatch(fin)}</div>
        </div>
      </div>
      
      ${isPlaceholder ? `
      <div class="champ-empty-state">
        Заполни <strong>финал</strong> во вкладке <strong>Плейофф</strong> — здесь появится твой чемпион и его путь через все 5 этапов плейофф
      </div>` : ''}
    </div>
  `;
  document.getElementById('tab-champion').innerHTML = html;
}

/* ═══════════════════════════════════════════════════════
   EXPORT / IMPORT / CLEAR
   ═══════════════════════════════════════════════════════ */
// Collect all of the current user's data into a snapshot object
function collectSnapshot(){
  const data = {};
  for(let i = 0; i < localStorage.length; i++){
    const k = localStorage.key(i);
    if(k && k.startsWith('wc26_' + USER + '_') && !k.endsWith('_bk')){
      data[k.replace('wc26_' + USER + '_', '')] = localStorage.getItem(k);
    }
  }
  let bk = {};
  try { bk = JSON.parse(localStorage.getItem(lk('bk')) || '{}'); } catch(e) {}
  return { name: USER, data, bk, exported: new Date().toISOString() };
}

function downloadSnapshot(snapshot, filename){
  const blob = new Blob([JSON.stringify(snapshot, null, 2)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function exportData(){
  downloadSnapshot(collectSnapshot(), `wc2026_${USER}.json`);
  toast('✓ JSON выгружен');
}

// Quick safety backup — same data, but timestamped filename and explicit safety messaging
function quickBackup(){
  const snapshot = collectSnapshot();
  const ts = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
  downloadSnapshot(snapshot, `wc2026_${USER}_backup_${ts}.json`);
  toast('💾 Бэкап сохранён');
}

// Restore own predictions from a backup snapshot into wc26_<USER>_* keys.
// collectSnapshot stores most data flat in snapshot.data (group predictions,
// timestamps, notes) but separates out the bracket into snapshot.bk because
// it's a nested object. We restore both: flat keys to lk(key), and bk to lk('bk')
// as a serialized JSON string.
function restoreOwnData(snapshot){
  let count = 0;
  // Guard against prototype-pollution keys arriving in an imported file.
  const SAFE_KEY = k => typeof k === 'string'
    && k !== '__proto__' && k !== 'constructor' && k !== 'prototype';
  if(snapshot.data && typeof snapshot.data === 'object'){
    for(const [key, value] of Object.entries(snapshot.data)){
      if(!SAFE_KEY(key)) continue;
      // localStorage stores strings; coerce and skip non-primitive junk so a
      // crafted file can't stuff objects/arrays into our keys.
      if(value == null || typeof value === 'object') continue;
      localStorage.setItem(lk(key), String(value));
      count++;
    }
  }
  if(snapshot.bk && typeof snapshot.bk === 'object' && !Array.isArray(snapshot.bk)){
    // Rebuild bk through a clean prototype-less object, dropping unsafe keys at
    // both levels. Values are read back through bkGet(), which esc()-escapes,
    // so markup here is inert — this guard is purely anti-pollution.
    const clean = Object.create(null);
    for(const [slot, fields] of Object.entries(snapshot.bk)){
      if(!SAFE_KEY(slot) || !fields || typeof fields !== 'object') continue;
      const cf = {};
      for(const [k, v] of Object.entries(fields)){
        if(!SAFE_KEY(k) || v == null || typeof v === 'object') continue;
        cf[k] = String(v);
      }
      clean[slot] = cf;
    }
    localStorage.setItem(lk('bk'), JSON.stringify(clean));
    count++;
  }
  bkInvalidate(); // bracket replaced wholesale — drop the parse cache
  return count;
}

// Smart import: auto-detects whether the file is the current user's own backup
// (→ offer restore with auto-backup) or another player's predictions (→ load as opponent).
function importData(){
  const input=document.createElement('input');
  input.type='file';input.accept='.json';
  input.onchange=e=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      let parsed;
      try{ parsed = JSON.parse(ev.target.result); }
      catch(err){ toast('Ошибка: не валидный JSON','err'); return; }

      const fileName = parsed.name;
      const isOwnBackup = fileName === USER;
      const isAmbiguous = !fileName; // no name field — let user decide

      if(isOwnBackup){
        // Own backup → restore flow with auto-backup safety net
        if(!confirm(`Восстановить свои данные из бэкапа?\n\nТекущее состояние будет автоматически сохранено в отдельный бэкап перед восстановлением.`)) return;
        quickBackup();
        const count = restoreOwnData(parsed);
        toast(`✓ Восстановлено ${count} ${count===1?'запись':count<5?'записи':'записей'}`);
        // Re-render current tab — easiest is to fully reload group view
        renderGroups();
        return;
      }

      if(isAmbiguous){
        // No name in file → ask user what they want
        const restore = confirm('В файле не указано имя владельца. Восстановить как свои данные?\n\nОК — восстановить как свои (с авто-бэкапом)\nОтмена — загрузить как прогноз соперника');
        if(restore){
          quickBackup();
          const count = restoreOwnData(parsed);
          toast(`✓ Восстановлено ${count} записей`);
          renderGroups();
        } else {
          localStorage.setItem('wc26_other_data', ev.target.result);
          otherInvalidate();
          toast('✓ Загружено как прогноз соперника','info');
        }
        return;
      }

      // Different user → load as opponent (original behavior)
      localStorage.setItem('wc26_other_data', ev.target.result);
      otherInvalidate();
      toast(`✓ Прогнозы ${fileName} загружены`,'info');
    };
    reader.readAsText(file);
  };
  input.click();
}

function clearData(){
  if(!confirm('Удалить ВСЕ свои прогнозы (группы + плейофф)?\n\nСначала будет автоматически создан бэкап.')) return;
  // Auto-backup first
  quickBackup();
  // Second confirmation after backup is downloaded
  if(!confirm('Бэкап сохранён в загрузки. Точно удалить все локальные данные?')) {
    toast('Отмена', 'info');
    return;
  }
  const del = [];
  for(let i = 0; i < localStorage.length; i++){
    const k = localStorage.key(i);
    if(k && k.startsWith('wc26_' + USER + '_')) del.push(k);
  }
  del.forEach(k => localStorage.removeItem(k));
  bkInvalidate(); // bracket keys wiped — drop the parse cache
  renderGroups();
  toast('✓ Очищено');
}

document.getElementById('name-input').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});

// Initial Twemoji parse for login screen / header text that doesn't go
// through renderGroups. Idempotent — safe to run multiple times.
if(document.body) parseEmoji(document.body);
</script>
